<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Watch Night</title><link rel="stylesheet" href="/styles.css?v=131"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=120"></script></head><body><div class="wrap"><div id="mast"></div><div id="main" class="card">Loading screening…</div><div class="footer">Watch together. Score blind. Reveal. Discuss. <span class="meta">Build v1.3.0</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const pathSlug=location.pathname.split('/').filter(Boolean).pop();
const slug=new URLSearchParams(location.search).get('watch')||pathSlug;
const who=currentPerson();
let watch=null,poll=null;
const cats=[['craft','Craft','How well made?'],['impact','Emotional Impact','How hard did it land?'],['rewatch','Rewatchability','How often might you consider returning?'],['overall','Overall','Greatness, all things considered.']];
function scoreInputs(){return cats.map(([id,n,d])=>`<div class="score-entry"><div><label for="${id}">${n}</label><div class="meta">${d}</div></div><input id="${id}" type="number" min="1" max="10" step="0.5" inputmode="decimal" placeholder="—" required></div>`).join('')}
function watchGuide(title){
 const guides={
  'No Country for Old Men':{
   preTitle:'Chance, choice, and the limits of control.',
   preBody:'Go in watching how little the film explains. The Coens keep stripping away exposition, music cues, and conventional heroics until behavior, sound, landscape, and consequence have to carry the meaning.',
   prePrompts:[
    'Notice how often the film withholds the confrontation you expect.',
    'Listen to the sound design when there is no score telling you what to feel.'
   ],
   postTitle:'What survives when control fails?',
   postBody:'The film looks like a chase thriller, but its deepest argument may be about people confronting a world that no longer obeys the moral rules they thought they understood. Moss treats danger as a problem to solve. Chigurh turns fate into ritual. Bell increasingly doubts that either law or experience can explain what he is seeing.',
   questions:[
    'Bell, Moss, or Chigurh: whose worldview does the film ultimately take most seriously — and whose does it reject?',
    'The Coens remove several expected payoffs. Did that make the film feel more truthful, more frustrating, or both?',
    'For this group: where does it sit among the Coens, and what does that ranking reveal about what each of us values in their movies?'
   ]
  },
  'Barry Lyndon':{
   preTitle:'Beauty, distance, ambition.',
   preBody:'Watch how Kubrick uses composition, music, and deliberate pacing to make an intimate rise-and-fall story feel as if history itself is observing it from a distance.',
   prePrompts:['Does the beauty bring you closer to Barry or hold you away from him?','Notice how often status is communicated before anyone says a word.'],
   postTitle:'Beauty, distance, ambition.',
   postBody:'Kubrick gives us an epic saga with the visual rigor of portraiture, music that does enormous emotional work, dry comedy, and a hero whose rise and fall can feel both intimate and strangely observed from history\'s distance.',
   questions:['What does Kubrick gain by refusing the usual intimacy of an epic?','What feels most alive today: class mobility, inherited privilege, masculinity, status performance, ambition, or something else?','Where does it sit in Kubrick, and why?']
  },
  "Miller's Crossing":{
   preTitle:'Loyalty, language, consequence.',
   preBody:'The plot is intentionally dense. Instead of trying to solve every alliance in real time, watch who is loyal to whom, who performs loyalty, and who treats loyalty as leverage.',
   prePrompts:['Listen for how dialogue changes power inside a scene.','Notice when Tom acts from principle versus self-preservation.'],
   postTitle:'Loyalty, language, consequence.',
   postBody:'Once the plot machinery settles, the movie becomes less about who outsmarted whom and more about what loyalty means when nearly every relationship is transactional.',
   questions:['Tom Reagan: principled, self-protective, loyal, manipulative — or some unstable mixture?','Where does it reward return most: plot, dialogue, performance, visual design, or moral ambiguity?','Among the Coens, what does this film reveal about what you actually value?']
  }
 };
 return guides[title]||{
  preTitle:'A frame, not an answer.',
  preBody:'Before the lights go down, carry two things with you: what is the film trying to do, and what is the filmmaking doing that the story alone cannot?',
  prePrompts:['Notice one formal choice that shapes how you feel.','Notice one moment that changes your understanding of a character or the film itself.'],
  postTitle:'Now make the differences useful.',
  postBody:'The scores are not the verdict. They are a map of where the experience diverged — and a starting point for a better conversation about why.',
  questions:['Where did the film work on you most strongly?','What did the craft accomplish that the screenplay or premise alone could not?','Where did your scores diverge, and what does that reveal about what each of you values?']
 };
}
function preamble(title,isHost){
 const g=watchGuide(title);
 return `<section class="watch-guide before"><div class="eyebrow">${isHost?'HOST / PICKER PREAMBLE':'BEFORE THE FILM'}</div><h2>${esc(g.preTitle)}</h2><p>${esc(g.preBody)}</p><ul>${g.prePrompts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`;
}
function postamble(title){
 const g=watchGuide(title);
 return `<section class="watch-guide after"><div class="eyebrow">AFTER THE REVEAL</div><h2>${esc(g.postTitle)}</h2><p>${esc(g.postBody)}</p><ol>${g.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`;
}
function statusLine(){const missing=(watch.expected_names||[]).filter(n=>!(watch.scored_names||[]).includes(n));if(watch.group_revealed_at)return 'The scores are out.';if(watch.all_in)return watch.reviewer_is_picker?'ALL SCORES ARE IN. Your move.':`All ${watch.expected_count} scores are in. Waiting for ${esc(watch.picker)} to lift the curtain.`;return `${watch.scored_count} of ${watch.expected_count} are in.${missing.length?` Waiting on ${missing.map(esc).join(', ')}.`:''}`}
async function reveal(){const r=await ltDb.rpc('get_club_reveal',{p_slug:slug});if(r.error||!r.data?.unlocked)return;const rs=r.data.ratings||[];const av=k=>rs.length?rs.reduce((s,x)=>s+Number(x[k]||0),0)/rs.length:0;const ranges=cats.map(([id,n])=>{const key=id==='impact'?'impact':id==='rewatch'?'rewatch':id;const vals=rs.map(x=>Number(x[key]));return {n,range:Math.max(...vals)-Math.min(...vals)}}).sort((a,b)=>b.range-a.range);main.innerHTML=`<div class="eyebrow">LOS TOROS REVEAL</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1><div class="reveal-grid">${rs.map(x=>`<div class="reveal-card"><div class="eyebrow">${esc(x.name)}</div><div class="reveal-total">${Number(x.total).toFixed(1)}<span>/40</span></div><div class="mini-scores"><span>CR ${Number(x.craft).toFixed(1)}</span><span>IM ${Number(x.impact).toFixed(1)}</span><span>RW ${Number(x.rewatch).toFixed(1)}</span><span>OV ${Number(x.overall).toFixed(1)}</span></div>${x.takeaway?`<p>“${esc(x.takeaway)}”</p>`:''}</div>`).join('')}</div><div class="clubline"><b>Club:</b> ${((av('craft')+av('impact')+av('rewatch')+av('overall'))).toFixed(1)} / 40 avg · RW ${av('rewatch').toFixed(1)} · Overall ${av('overall').toFixed(1)}${ranges[0]?` · Biggest split: ${ranges[0].n}`:''}</div>${postamble(watch.title)}<div class="reveal-actions"><a class="btn" href="/index.html">BACK TO THE BOARD</a></div>`;}
async function load(){const {data,error}=await ltDb.rpc('get_club_watch',{p_slug:slug,p_reviewer:who||null});if(error||!data){main.innerHTML='<p>Club screening not found.</p>';return}watch=data;if(watch.group_revealed_at){clearInterval(poll);await reveal();return}if(!who){main.innerHTML=`<div class="eyebrow">OFFICIAL CLUB WATCH</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1><p>Choose your name in the Los Toros header first.</p>`;return}if(!watch.reviewer_expected){main.innerHTML=`<div class="eyebrow">OFFICIAL CLUB WATCH</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1><p>${esc(who)}, you aren't on tonight's expected scorer list.</p><p class="meta">Expected: ${(watch.expected_names||[]).map(esc).join(', ')}</p>`;return}if(watch.my_rating){main.innerHTML=`<div class="eyebrow">SCORE LOCKED</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1><div class="locked-score"><b>${(Number(watch.my_rating.craft)+Number(watch.my_rating.emotional_impact)+Number(watch.my_rating.rewatchability)+Number(watch.my_rating.overall)).toFixed(1)} / 40</b><span>CR ${Number(watch.my_rating.craft).toFixed(1)} · IM ${Number(watch.my_rating.emotional_impact).toFixed(1)} · RW ${Number(watch.my_rating.rewatchability).toFixed(1)} · OV ${Number(watch.my_rating.overall).toFixed(1)}</span></div><div class="curtain">${statusLine()}</div>${watch.all_in&&watch.reviewer_is_picker?`<button class="btn reveal-btn" id="launch">REVEAL THE SCORES</button>`:''}`;if(document.getElementById('launch'))document.getElementById('launch').onclick=async()=>{const b=document.getElementById('launch');b.disabled=true;b.textContent='Lifting curtain…';const x=await ltDb.rpc('launch_club_reveal',{p_slug:slug,p_picker:who});if(x.error){b.disabled=false;b.textContent='REVEAL THE SCORES';alert(x.error.message);return}await load()};return}
main.innerHTML=`<div class="eyebrow">LOS TOROS WATCH NIGHT · PICKED BY ${esc(watch.picker||'—')}</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1>${watch.venue?`<p class="meta">${esc(watch.venue)}</p>`:''}${preamble(watch.title,watch.reviewer_is_picker)}<section class="score-section"><div class="eyebrow">AFTER THE FILM · BEFORE DISCUSSION</div><h2>Score it blind.</h2><p class="lede">Commit the fresh reaction before the room starts influencing it.</p><div class="score-help"><span><b>1–10</b> · .5s welcome · RW = how often might I return?</span><a href="/about.html#scoring-guide" target="_blank" rel="noopener">Scoring guide ↗</a></div><form id="form">${scoreInputs()}<div class="field"><label>What is this film?</label><textarea id="what" placeholder="Optional. A short description in your own words."></textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="Optional. The thing you'd say walking out."></textarea></div><button class="btn" type="submit">LOCK MY SCORE</button></form><div class="curtain">${statusLine()}</div></section>`;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;const vals={craft:Number(craft.value),impact:Number(impact.value),rewatch:Number(rewatch.value),overall:Number(overall.value)};if(Object.values(vals).some(v=>!Number.isFinite(v)||v<1||v>10)){alert('Scores must be between 1 and 10.');return}b.disabled=true;b.textContent='Locking…';const x=await ltDb.rpc('submit_movie_rating',{p_title:watch.title,p_year:watch.year||null,p_reviewer:who,p_craft:vals.craft,p_impact:vals.impact,p_rewatch:vals.rewatch,p_overall:vals.overall,p_what:what.value.trim()||null,p_takeaway:takeaway.value.trim()||null,p_watch_event:watch.watch_event_id});if(x.error){b.disabled=false;b.textContent='LOCK MY SCORE';alert(x.error.message);return}await load()};}
load();poll=setInterval(()=>{if(watch&&!watch.group_revealed_at)load()},5000);
</script><style>.score-help{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0;font-size:14px;color:var(--muted)}.score-help a{font-weight:800}.score-entry{display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.score-entry input{font:inherit;font-size:28px;font-weight:800;padding:12px;text-align:center;width:100%}.curtain{margin-top:18px;padding:16px;border:2px solid var(--ink);font-weight:800;text-align:center}.locked-score{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:16px;background:var(--paper2)}.locked-score b{font-size:28px}.reveal-btn{display:block;margin:18px auto 0;font-size:18px}.reveal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.reveal-card{border:2px solid var(--ink);padding:14px;background:var(--paper2)}.reveal-total{font-size:34px;font-weight:900}.reveal-total span{font-size:13px;margin-left:3px}.mini-scores{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;font-size:12px}.clubline{padding:12px;border-left:3px solid var(--ink);margin:12px 0 22px}.watch-guide{border:2px solid var(--ink);padding:18px;margin:20px 0;background:var(--paper2)}.watch-guide h2{margin-top:5px}.watch-guide li{margin:10px 0;line-height:1.5}.before{border-left:6px solid var(--gold)}.after{border-left:6px solid var(--red)}.score-section{border-top:3px solid var(--ink);margin-top:26px;padding-top:18px}.reveal-actions{margin-top:22px;text-align:center}@media(max-width:600px){.score-entry{grid-template-columns:1fr 92px}.score-entry input{font-size:30px}.score-help{align-items:flex-start}.watch-guide{padding:16px}}</style></body></html>
