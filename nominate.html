<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Nominate</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script></head><body><div class="wrap"><div id="mast"></div><h1>Put it in the Hopper</h1><p class="lede">You love it enough to make the case. That’s enough.</p><div class="notice">One core-member nomination puts a film in <b>The Hopper</b>. A second core member backs it and it moves to the <b>Queue</b>. No minimum score. No taste police.</div><form id="form"><div class="field"><label>Film title</label><input id="title" required placeholder="Miller's Crossing"></div><div class="two"><div class="field"><label>Year (optional)</label><input id="year" type="number" min="1880" max="2200" placeholder="1990"></div><div class="field"><label>Your name</label><select id="member" required></select></div></div><div class="two"><div class="field"><label>Director (optional)</label><input id="director"></div><div class="field"><label>Genre (optional)</label><input id="genre"></div></div><div class="field"><label>Why this one? (optional)</label><textarea id="note" placeholder="Why should the rest of us come back to it?"></textarea></div><button class="btn" type="submit">Nominate</button></form><div id="msg" class="notice hide"></div><div class="footer">Members only for Hopper / Queue. Guests are always welcome to rate films.</div></div><script src="/common.js"></script><script>document.getElementById('mast').innerHTML=mast();document.getElementById('member').innerHTML='<option value="">Choose…</option>'+memberOptions(false);document.getElementById('form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter,msg=document.getElementById('msg');if(!ltDb){showMsg(msg,'Database connection is not ready. Refresh and try again.','error');return}btn.disabled=true;btn.textContent='Adding…';const {data,error}=await ltDb.rpc('nominate_movie',{p_title:title.value.trim(),p_year:year.value?Number(year.value):null,p_member:member.value,p_director:director.value.trim()||null,p_genre:genre.value.trim()||null,p_rt:null,p_note:note.value.trim()||null});btn.disabled=false;btn.textContent='Nominate';if(error){showMsg(msg,error.message,'error');return}showMsg(msg,`${title.value.trim()} is in the Hopper.`, 'success');e.target.reset()};</script></body></html>
