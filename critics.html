<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Critic Cards</title><link rel="stylesheet" href="/styles.css?v=117"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=117"></script></head><body><div class="wrap"><div id="mast"></div><h1>Critic Cards</h1><p class="lede">Scores first. Then taste, picks, nominations and the occasional indefensible opinion.</p><div id="tabs" class="tabs"></div><div id="main" class="card">Loading the record…</div><div class="footer">Missing a screening costs nothing. No scoring from memory just to fill a hole. <span class="meta">Build v1.1.7</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const order=['Greg','Keith','David','Steele','Will'];
let rows=[],extras=[];
function avg(arr,key){const v=arr.map(x=>x[key]).filter(x=>x!=null).map(Number);return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null}
function totalAvg(arr){const v=arr.map(x=>x.total_40).filter(x=>x!=null).map(Number);return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null}
function totalClass(v){if(v==null)return 'total-none';v=Number(v);return v>=35?'total-great':v>=30?'total-good':v>=24?'total-mid':'total-low'}
function filmList(items,max=6){if(!items?.length)return '<span class="meta">None yet.</span>';return items.slice(0,max).map(x=>`<span class="chip">${esc(x.title)}${x.year?' ('+x.year+')':''}</span>`).join(' ')}
function commentsList(items){if(!items?.length)return '<p class="meta">No written takes yet.</p>';return items.slice(0,3).map(x=>`<blockquote class="take"><b>${esc(x.title)}${x.year?' ('+x.year+')':''}</b>${x.what_is_it?`<div>${esc(x.what_is_it)}</div>`:''}${x.takeaway?`<div class="meta">“${esc(x.takeaway)}”</div>`:''}</blockquote>`).join('')}
function directorList(items){if(!items?.length)return '<span class="meta">None yet.</span>';return items.map(x=>`<span class="chip">${esc(x.name||x.title||x)}</span>`).join(' ')}
function singleFilm(f){return f?.title?`${esc(f.title)}${f.year?' ('+f.year+')':''}`:'—'}
function topBy(arr,key){return arr.filter(x=>x[key]!=null).sort((a,b)=>Number(b[key])-Number(a[key]))[0]||null}
function scoreSection(rated,ex,mine){
 const ta=totalAvg(rated),rw=avg(rated,'rewatchability'),ov=avg(rated,'overall'),best=topBy(rated,'total_40'),rewatch=topBy(rated,'rewatchability');
 const stats=`<div class="score-grid"><div class="score-stat score-main ${totalClass(ta)}"><div class="eyebrow">Avg Total</div><div class="big-score">${ta==null?'—':ta.toFixed(1)}</div><div class="meta">/ 40</div></div><div class="score-stat"><div class="eyebrow">Avg RW</div><div class="stat-num">${fmt(rw)}</div></div><div class="score-stat"><div class="eyebrow">Avg Overall</div><div class="stat-num">${fmt(ov)}</div></div><div class="score-stat"><div class="eyebrow">Films Scored</div><div class="stat-num">${rated.length}</div></div><div class="score-stat"><div class="eyebrow">Club Points</div><div class="stat-num">${Number(ex.points||0)}</div></div></div>`;
 const spotlights=`<div class="spotlight-grid"><div class="spotlight"><span class="eyebrow">Highest Rated</span><b>${best?`${esc(best.title)} <span class="meta">${best.year||''}</span>`:'—'}</b>${best?.total_40!=null?`<span class="total-pill ${totalClass(best.total_40)}">${Number(best.total_40).toFixed(1)} / 40</span>`:''}</div><div class="spotlight"><span class="eyebrow">Most Rewatchable</span><b>${rewatch?`${esc(rewatch.title)} <span class="meta">${rewatch.year||''}</span>`:'—'}</b>${rewatch?.rewatchability!=null?`<span class="rw-badge">RW ${Number(rewatch.rewatchability).toFixed(1)}</span>`:''}</div></div>`;
 const table=`<div class="score-table-wrap"><table class="score-table"><thead><tr><th>Club film</th><th>Total / 40</th><th>Craft</th><th>Impact</th><th>RW</th><th>Overall</th></tr></thead><tbody>${mine.map(r=>`<tr><td><b>${esc(r.title)}</b> <span class="meta">${r.year||''}</span>${r.canon?' <span class="meta">· Canon</span>':''}${Number(r.rating_count)>1?` <span class="meta">· ${r.rating_count} ratings</span>`:''}${r.legacy_incomplete?' <span class="meta">· legacy</span>':''}</td><td><span class="total-pill ${totalClass(r.total_40)}">${r.total_40==null?'—':Number(r.total_40).toFixed(1)}</span></td><td>${fmt(r.craft)}</td><td>${fmt(r.emotional_impact)}</td><td>${fmt(r.rewatchability)}</td><td>${fmt(r.overall)}</td></tr>`).join('')}</tbody></table></div>`;
 return `<section class="section"><div class="section-head"><div><div class="eyebrow">THE SCORE</div><h3>How they rate</h3></div></div>${stats}${spotlights}${table}<div class="points-note"><b>Club Points reward participation, not perfection.</b> +1 rating · +1 nomination · +1 pick. No penalties for missed screenings, and newer members aren't expected to catch up.</div></section>`;
}
function criticSection(p){
 if(!p||!p.favorite_films_today)return `<section class="section"><div class="section-head"><div><div class="eyebrow">THE CRITIC</div><h3>Starting point</h3></div></div><p class="meta">Critic Card starter not filled out yet.</p></section>`;
 return `<section class="section"><div class="section-head"><div><div class="eyebrow">THE CRITIC</div><h3>What they say they like</h3></div></div><div class="profile-row"><b>Five favorites — today</b><div>${filmList(p.favorite_films_today,5)}</div></div><div class="profile-row"><b>Would watch tonight</b><div>${filmList(p.watch_tonight,3)}</div></div><div class="profile-row"><b>Favorite directors</b><div>${directorList(p.favorite_directors)}</div></div><div class="profile-row"><b>Favorite genres</b><div>${(p.favorite_genres||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join(' ')||'—'}</div></div><div class="profile-grid"><div><span class="eyebrow">Underrated</span><b>${singleFilm(p.underrated)}</b></div><div class="opinion-box"><span class="eyebrow">Overrated 🙄</span><b>${singleFilm(p.overrated)}</b></div><div><span class="eyebrow">Will Defend</span><b>${singleFilm(p.defend_to_club)}</b></div><div><span class="eyebrow">Doesn't Fit</span><b>${singleFilm(p.surprise_favorite)}</b></div></div><div class="rewatch-creed"><span class="eyebrow">Rewatchability, according to ${esc(currentNameForCreed||'this critic')}</span><div>${esc(p.rewatch_definition||'—')}</div></div></section>`;
}
let currentNameForCreed='';
function clubSection(ex){return `<section class="section"><div class="section-head"><div><div class="eyebrow">THE CLUB</div><h3>What they've done here</h3></div></div><div class="grid"><div class="card"><div class="eyebrow">Nominated</div><p>${filmList(ex.nomination_films)}</p></div><div class="card"><div class="eyebrow">Picked for the Club</div><p>${filmList(ex.pick_films)}</p></div></div><div class="takes-card"><div class="eyebrow">In Their Own Words</div>${commentsList(ex.comments)}</div></section>`}
function render(name){
 currentNameForCreed=name;
 const mine=rows.filter(r=>r.display_name===name),ex=extras.find(x=>x.name===name)||{};
 tabs.innerHTML=order.map(n=>`<button class="tab ${n===name?'active':''}" data-name="${n}">${n}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.name));
 const rated=mine.filter(r=>r.overall!=null);
 main.innerHTML=`<div class="critic-header"><div class="eyebrow">LOS TOROS CRITIC</div><h2>${esc(name)}</h2><div class="meta">Scores change. Taste wanders. The record remembers.</div></div>${scoreSection(rated,ex,mine)}${criticSection(ex.profile_starter)}${clubSection(ex)}`;
}
(async()=>{const [a,b]=await Promise.all([ltDb.rpc('get_critic_scorecards'),ltDb.rpc('get_critic_card_extras')]);if(a.error||b.error){main.innerHTML='<p>Could not load Critic Cards.</p>';return}rows=a.data||[];extras=b.data||[];const requested=new URLSearchParams(location.search).get('critic');const who=order.includes(requested)?requested:currentPerson();render(order.includes(who)?who:'Greg')})();
</script><style>
.critic-header{padding:6px 0 18px;border-bottom:3px solid var(--ink);margin-bottom:20px}.critic-header h2{font-size:38px;margin:2px 0 4px;letter-spacing:-.03em}.section{padding:22px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0;padding-top:0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section-head h3{font-size:23px;margin:2px 0 0}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--muted)}.score-grid{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:9px}.score-stat{border:1px solid var(--line);padding:14px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between}.score-main{border-width:2px}.big-score{font-size:34px;font-weight:900;line-height:1}.stat-num{font-size:27px;font-weight:850}.spotlight-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.spotlight{background:var(--paper2);padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}.spotlight .eyebrow{grid-column:1/-1}.total-pill,.rw-badge{display:inline-block;padding:5px 7px;border-radius:5px;font-weight:800;font-size:12px}.rw-badge{border:1px solid var(--line)}.score-table-wrap{overflow-x:auto;margin-top:16px}.score-table{width:100%;border-collapse:collapse}.score-table th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px;text-align:center}.score-table th:first-child{text-align:left}.score-table td{padding:11px 8px;border-top:1px solid var(--line);text-align:center}.score-table td:first-child{text-align:left}.chip{display:inline-block;border:1px solid var(--line);padding:5px 8px;margin:2px 2px 2px 0;font-size:12px}.total-low{background:#f1d8d1}.total-mid{background:#f2e1b8}.total-good{background:#d8e5cf}.total-great{background:#bdd6c2}.total-none{background:var(--paper2)}.points-note{margin-top:10px;padding:10px 12px;border-left:2px solid var(--line);font-size:12px;line-height:1.45;color:var(--muted)}.profile-row{padding:11px 0;border-top:1px solid var(--line)}.profile-row>b{display:block;margin-bottom:6px}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:12px 0;border-top:1px solid var(--line)}.profile-grid>div{padding:11px;background:var(--paper2);display:flex;flex-direction:column;gap:4px}.opinion-box{transform:rotate(-.25deg)}.rewatch-creed{margin-top:4px;padding:15px 16px;border:2px solid var(--ink);font-size:17px;line-height:1.4}.rewatch-creed .eyebrow{display:block;margin-bottom:5px}.takes-card{margin-top:12px;padding:14px;background:var(--paper2)}.take{margin:12px 0;padding-left:14px;border-left:2px solid var(--line)}
@media(max-width:800px){.score-grid{grid-template-columns:repeat(2,1fr)}.score-main{grid-column:1/-1}.spotlight-grid{grid-template-columns:1fr}}
@media(max-width:600px){.critic-header h2{font-size:32px}.profile-grid{grid-template-columns:1fr}.score-grid{grid-template-columns:1fr 1fr}.score-table{min-width:620px}}
</style></body></html>
