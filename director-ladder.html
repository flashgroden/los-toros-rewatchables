<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Director Ladder</title><link rel="stylesheet" href="/styles.css?v=126"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=126"></script></head><body><div class="wrap"><div id="mast"></div><div class="ladder-head"><div><div class="eyebrow">DIRECTOR LADDER</div><h1 id="title">Loading…</h1><p class="lede" id="sub"></p></div><a id="back" class="btn ghost" href="/critics.html">Back to Critic Card</a></div><div class="tabs" id="directorTabs"></div><div id="main" class="card">Loading filmography…</div><div class="footer">Confirm you've seen it, then rank it. <span class="meta">Build v1.2.6</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const qs=new URLSearchParams(location.search),who=qs.get('critic')||currentPerson()||'Greg';let director=qs.get('director')||'kubrick';
const main=document.getElementById('main'),title=document.getElementById('title'),sub=document.getElementById('sub'),tabs=document.getElementById('directorTabs'),back=document.getElementById('back');
back.href='/critics.html?critic='+encodeURIComponent(who);
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const labels={kubrick:'Stanley Kubrick','coen-brothers':'Coen Brothers'};let rows=[],editable=false,dragId=null,saving=false;
function total(r){return r.total_40==null?null:Number(r.total_40)}
function isRanked(r){return !!r.times_seen_bucket&&r.times_seen_bucket!=='0'}
function scoreLine(r){if(total(r)==null)return '<span class="meta">Unscored</span>';return `<b>${total(r).toFixed(1)} /40</b> · CR ${Number(r.craft).toFixed(1)} · IM ${Number(r.emotional_impact).toFixed(1)} · RW ${Number(r.rewatchability).toFixed(1)} · OV ${Number(r.overall).toFixed(1)}`}
function viewingLine(r){const bits=[];if(!r.times_seen_bucket||r.times_seen_bucket==='0')return 'Not ranked · times seen not confirmed';bits.push('Seen '+r.times_seen_bucket+'×');if(r.last_venue)bits.push('Last: '+r.last_venue);return bits.join(' · ')}
function seedSort(a,b){const ar=isRanked(a),br=isRanked(b);if(ar!==br)return ar?-1:1;if(ar&&br){const an=a.personal_rank!=null,bn=b.personal_rank!=null;if(an&&bn)return Number(a.personal_rank)-Number(b.personal_rank)||Number(total(b)||-1)-Number(total(a)||-1)||a.year-b.year;if(an!==bn)return an?-1:1;const as=total(a)!=null,bs=total(b)!=null;if(as!==bs)return as?-1:1;if(as&&bs)return Number(total(b))-Number(total(a))||a.year-b.year}return a.year-b.year||a.title.localeCompare(b.title)}
function entries(){let rank=0;return rows.map(r=>({film_id:r.film_id,rank:isRanked(r)?++rank:null,times_seen:r.times_seen_bucket||null}))}
async function persist(){if(!editable||saving)return;saving=true;const s=document.getElementById('saveState');if(s)s.textContent='Saving…';const {error}=await ltDb.rpc('save_director_ladder_order',{p_reviewer:who,p_director:director,p_entries:entries()});saving=false;if(s)s.textContent=error?'Could not save':'Saved';if(error){alert(error.message);return}setTimeout(()=>{if(s)s.textContent=''},900)}
function normalizeOrder(){const ranked=rows.filter(isRanked),unranked=rows.filter(r=>!isRanked(r));rows=[...ranked,...unranked]}
function move(id,delta){const i=rows.findIndex(r=>r.film_id===id);if(i<0||!isRanked(rows[i]))return;const rankedCount=rows.filter(isRanked).length;let j=i+delta;if(j<0||j>=rankedCount)return;[rows[i],rows[j]]=[rows[j],rows[i]];renderRows();persist()}
function dragMove(fromId,toId){if(!fromId||!toId||fromId===toId)return;const from=rows.findIndex(r=>r.film_id===fromId),to=rows.findIndex(r=>r.film_id===toId);if(from<0||to<0||!isRanked(rows[from])||!isRanked(rows[to]))return;const [item]=rows.splice(from,1);rows.splice(to,0,item);renderRows();persist()}
function renderRows(){let rank=0;const html=rows.map(r=>{const ranked=isRanked(r);const shownRank=ranked?'#'+(++rank):'—';return `<div class="ladder-row ${ranked?'':'unranked-row'}" data-id="${r.film_id}" ${editable&&ranked?'draggable="true"':''}><div class="rank-number">${shownRank}</div><div class="ladder-film"><div class="film-title">${esc(r.title)} <span class="meta">(${r.year})</span></div><div class="score-line">${scoreLine(r)}</div><div class="meta memory-line">${esc(viewingLine(r))}</div></div>${editable?`<div class="ladder-edit"><div class="move-buttons"><button class="move" type="button" data-move="-1" ${ranked?'':'disabled'} aria-label="Move ${esc(r.title)} up">↑</button><button class="move" type="button" data-move="1" ${ranked?'':'disabled'} aria-label="Move ${esc(r.title)} down">↓</button></div><label>Times seen<select id="seen-${r.film_id}"><option value="" ${!r.times_seen_bucket?'selected':''}>0 / not set</option><option value="0" ${r.times_seen_bucket==='0'?'selected':''}>0 / never seen</option>${['1','2','3-5','6-10','10+'].map(x=>`<option value="${x}" ${r.times_seen_bucket===x?'selected':''}>${x}</option>`).join('')}</select></label><span class="drag-handle ${ranked?'':'disabled-handle'}" title="${ranked?'Drag to reorder':'Set times seen before ranking'}">☰</span></div>`:'<div></div>'}</div>`}).join('');main.querySelector('.ladder-list').innerHTML=html;
 if(!editable)return;
 main.querySelectorAll('.ladder-row').forEach(el=>{const id=el.dataset.id;el.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(id,Number(b.dataset.move)));const sel=document.getElementById('seen-'+id);sel.onchange=()=>{const r=rows.find(x=>x.film_id===id);r.times_seen_bucket=sel.value||null;normalizeOrder();renderRows();persist()};if(el.draggable){el.addEventListener('dragstart',e=>{dragId=id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>{dragId=null;el.classList.remove('dragging')});el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});el.addEventListener('drop',e=>{e.preventDefault();dragMove(dragId,id)})}})}
async function load(){title.textContent=labels[director]||director;sub.textContent=`${who}'s ladder — only films with confirmed viewing history enter the ranking.`;tabs.innerHTML=['kubrick','coen-brothers'].map(d=>`<button class="tab ${d===director?'active':''}" data-d="${d}">${labels[d]}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{director=b.dataset.d;const u=new URL(location.href);u.searchParams.set('director',director);history.replaceState({},'',u);load()});const {data,error}=await ltDb.rpc('get_director_ladder',{p_director:director,p_reviewer:who});if(error){main.innerHTML='<p>Could not load this ladder.</p>';return}editable=currentPerson()===who;rows=(data||[]).sort(seedSort);main.innerHTML=`<div class="ladder-note"><b>Set Times Seen first.</b> A film stays below the ladder until you confirm you've seen it at least once. Then its position becomes its rank. Drag or use ↑/↓ to adjust. <b>Total /40</b> remains the fresh Los Toros score: CR = Craft · IM = Impact · RW = Rewatchability · OV = Overall. <span id="saveState" class="meta"></span></div><div class="ladder-list"></div>`;renderRows()}
load();
</script><style>.ladder-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.ladder-note{padding:12px 14px;background:var(--paper2);border-left:3px solid var(--ink);margin-bottom:8px}.ladder-row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.ladder-row[draggable=true]{cursor:grab}.ladder-row.dragging{opacity:.45}.unranked-row{opacity:.62}.rank-number{font-family:'DM Serif Display',serif;font-size:24px}.score-line{font-size:13px;margin-top:4px}.memory-line{margin-top:4px}.ladder-edit{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.ladder-edit label{display:grid;gap:3px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.ladder-edit select{font:inherit;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:126px}.move-buttons{display:flex;gap:4px}.move{font:inherit;font-weight:800;width:38px;height:38px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer}.move:disabled{opacity:.25;cursor:not-allowed}.drag-handle{font-size:20px;color:var(--muted);padding:8px;user-select:none}.disabled-handle{opacity:.2}@media(max-width:720px){.ladder-head{display:block}.ladder-head .btn{margin-top:10px}.ladder-row{grid-template-columns:38px 1fr}.ladder-edit{grid-column:2/-1}.score-line{line-height:1.5}.drag-handle{display:none}.move{width:44px;height:44px}}</style></body></html>
