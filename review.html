<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Rate a Film</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script></head><body><div class="wrap"><div id="mast"></div><h1>Rate a Film</h1><p class="lede">Any film. Any time. Score first. Compare second.</p><div class="notice">Members and guests can rate anything. Independent ratings do not affect Hopper, Queue or Canon unless the film is also part of an official club screening.</div><form id="form"><div class="two"><div class="field"><label>Film</label><input id="film" required placeholder="Dr. Strangelove (1964)"></div><div class="field"><label>You</label><select id="who" required></select></div></div><div id="guestField" class="field hide"><label>Guest / friend name</label><input id="guestName" placeholder="Name"></div><div id="scores"></div><div class="field"><label>What is this film?</label><textarea id="what" placeholder="Your short description"></textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="The thing you'd say walking out"></textarea></div><button class="btn" type="submit">Lock My Scores</button></form><div id="msg" class="notice hide"></div><div id="reveal" class="hide"></div><div class="footer">Your four scores are required. No more silent missing-Craft bug.</div></div><script src="/common.js"></script><script>
document.getElementById('mast').innerHTML=mast();who.innerHTML='<option value="">Choose…</option>'+memberOptions(true);who.onchange=()=>guestField.classList.toggle('hide',who.value!=='__guest');
const cats=[['craft','Craft','How well does it execute the craft of cinema?'],['impact','Emotional Impact','How did it land emotionally?'],['rewatch','Rewatchability','Do you want to live with it again?'],['overall','Overall','Bottom line: how much do you love it?']];
scores.innerHTML=cats.map(([id,n,d])=>`<div class="score-row"><div><label>${n}</label><div class="meta">${d}</div><input id="${id}" type="range" min="1" max="10" step="0.1" value="7" oninput="document.getElementById('${id}N').textContent=Number(this.value).toFixed(1)"></div><div id="${id}N" class="num">7.0</div></div>`).join('');
const qp=new URLSearchParams(location.search);if(qp.get('film'))film.value=qp.get('film');
form.onsubmit=async e=>{e.preventDefault();const btn=e.submitter,msg=document.getElementById('msg');if(!ltDb){showMsg(msg,'Database connection is not ready. Refresh and try again.','error');return}let reviewer=who.value==='__guest'?guestName.value.trim():who.value;if(!reviewer){showMsg(msg,'Add your name first.','error');return}const parsed=parseFilmLabel(film.value);btn.disabled=true;btn.textContent='Saving…';const payload={p_title:parsed.title,p_year:parsed.year,p_reviewer:reviewer,p_craft:Number(craft.value),p_impact:Number(impact.value),p_rewatch:Number(rewatch.value),p_overall:Number(overall.value),p_what:what.value.trim()||null,p_takeaway:takeaway.value.trim()||null,p_watch_event:null};const {data,error}=await ltDb.rpc('submit_movie_rating',payload);btn.disabled=false;btn.textContent='Lock My Scores';if(error){showMsg(msg,error.message,'error');return}showMsg(msg,'Locked. Now you can compare.','success');reveal.classList.remove('hide');reveal.innerHTML=`<h2>Your scorecard</h2><div class="card"><h3>${parsed.title}</h3><div class="statline">${cats.map(([id,n])=>`<div class="stat"><b>${Number(document.getElementById(id).value).toFixed(1)}</b>${n}</div>`).join('')}</div><a class="btn ghost" href="list.html">See the Board</a></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
</script></body></html>
