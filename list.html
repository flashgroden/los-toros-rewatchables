<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — The Board</title><link rel="stylesheet" href="/styles.css?v=103"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=103"></script></head><body><div class="wrap"><div id="mast"></div><h1>The Board</h1><p class="lede">Not the best movies. The ones worth coming back to — and why.</p><div id="status" class="notice hide"></div><div class="tabs"><button class="tab active" data-tab="dennis">The Dennis</button><button class="tab" data-tab="queue">Queue</button><button class="tab" data-tab="watched">Watched</button><button class="tab" data-tab="canon">Canon</button><button class="tab" data-tab="best">Highest Rated</button></div><div id="panel"></div><div class="footer"><div class="tagline">Los Toros is not about deciding which movies are best. It’s about discovering which movies are worth coming back to—and why.</div><div class="meta">Build v1.0.3</div></div></div><script src="/common.js?v=103"></script><script>
document.getElementById('mast').innerHTML=mast();
const panel=document.getElementById('panel'),statusEl=document.getElementById('status');let data={queue:[],dennis:[],screenings:[],best:[]},tab='dennis';
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function filmInfo(x){return [x.year,x.director,x.genre].filter(Boolean).join(' · ')}function nominateUrl(x){const p=new URLSearchParams({title:x.title});if(x.year)p.set('year',x.year);return 'nominate.html?'+p.toString()}
function nomRow(x){return `<a class="film-row film-link" href="${nominateUrl(x)}"><div class="film-title">${esc(x.title)}${x.year?` <span class="meta">(${x.year})</span>`:''}<div class="meta">${esc(filmInfo(x))}</div><div class="meta"><b>Nominated by ${esc(x.nominators||'—')}</b></div></div><div><span class="pill">${x.member_supports>=2?'Queue':'Nominate'}</span></div><div></div></a>`}
function rowMovie(x){return `<div class="film-row"><div class="film-title">${esc(x.title)}${x.year?` <span class="meta">(${x.year})</span>`:''}</div><div>${fmt(x.avg_overall)}</div><div>${fmt(x.avg_rewatchability)}</div><div>${fmt(x.avg_craft)}</div><div>${fmt(x.avg_impact)}</div><div>${fmt(x.avg_four_category_score)}</div></div>`}
function ratedCard(x,i){return `<div class="rated-card"><div class="rated-rank">#${i+1}</div><div class="rated-main"><div class="film-title">${esc(x.title)}${x.year?` <span class="meta">(${x.year})</span>`:''}</div><div class="rated-breakdown"><span>Craft <b>${fmt(x.avg_craft)}</b></span><span>Impact <b>${fmt(x.avg_impact)}</b></span><span>Rewatch <b>${fmt(x.avg_rewatchability)}</b></span><span>Overall <b>${fmt(x.avg_overall)}</b></span></div></div><div class="rated-score"><b>${fmt(x.avg_four_category_score)}</b><span>Score</span></div></div>`}
function render(){if(tab==='queue'||tab==='dennis'){const arr=data[tab];panel.innerHTML=`<div class="notice">${tab==='queue'?'2+ core members have nominated these. Next picker chooses from here.':'One Toro has nominated each of these. Click a film to review the details and nominate it yourself. A second nomination moves it to the Queue.'}</div>`+(arr.length?arr.map(nomRow).join(''):'<div class="card">Nothing here yet.</div>');return}if(tab==='watched'||tab==='canon'){const arr=data.screenings.filter(x=>tab==='watched'?x.official:x.canon);panel.innerHTML=`<div class="film-row head"><div>Film</div><div>Overall</div><div>RW</div><div>Craft</div><div>Impact</div><div>Score</div></div>`+(arr.length?arr.map(rowMovie).join(''):'<div class="card">Nothing here yet.</div>');return}const ranked=[...data.best].sort((a,b)=>Number(b.avg_four_category_score||0)-Number(a.avg_four_category_score||0));panel.innerHTML=`<div class="notice">All member-rated films, highest to lowest by the combined four-category score. Canon is separate.</div>`+(ranked.length?ranked.map(ratedCard).join(''):'<div class="card">No ratings yet.</div>')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
(async()=>{try{const [d,q,s,b]=await Promise.all([ltDb.from('current_nomination_status').select('*').eq('nomination_status','Dennis').order('first_nominated_at',{ascending:false}),ltDb.from('current_nomination_status').select('*').eq('nomination_status','Queue').order('member_supports',{ascending:false}),ltDb.from('club_screening_summary').select('*').order('starts_at',{ascending:false}),ltDb.from('film_member_rating_summary').select('*').order('avg_four_category_score',{ascending:false})]);for(const r of[d,q,s,b])if(r.error)throw r.error;data={dennis:d.data||[],queue:q.data||[],screenings:s.data||[],best:b.data||[]};render()}catch(e){showMsg(statusEl,'The board could not load yet: '+e.message,'error')}})();
</script><style>.film-link{color:inherit;text-decoration:none;cursor:pointer}.film-link:hover{background:rgba(255,250,240,.75)}.rated-card{display:grid;grid-template-columns:42px 1fr 100px;gap:14px;align-items:center;border-top:1px solid var(--line);padding:15px 0}.rated-rank{font-size:11px;color:var(--muted)}.rated-score{text-align:right}.rated-score b{display:block;font-family:'DM Serif Display',serif;font-size:34px;line-height:1}.rated-score span{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;margin-top:3px}.rated-breakdown{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:10px;text-transform:uppercase;color:var(--muted)}.rated-breakdown b{color:var(--ink);font-size:12px}</style></body></html>
