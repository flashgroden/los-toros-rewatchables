<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — On Deck</title><link rel="stylesheet" href="/styles.css?v=108"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=108"></script></head><body><div class="wrap"><div id="mast"></div><h1>On Deck</h1><p class="lede">The next Los Toros watch, with just enough context to sharpen the room without turning movie night into homework.</p><div id="main" class="card">Loading next watch…</div><div class="footer">Build v1.0.8</div></div><script src="/common.js?v=108"></script><script>
document.getElementById('mast').innerHTML=mast();const main=document.getElementById('main');const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function millers(){return `<div class="kicker">Next Watch</div><h2>Miller's Crossing <span class="meta">(1990)</span></h2><p><b>Picked by Will.</b></p><div class="grid"><div class="card"><div class="kicker">Before</div><h3>Watch the alliances.</h3><p>The Coens build this gangster film less around plot mechanics than around loyalty, leverage and misdirection. Pay attention to who thinks they understand Tom Reagan — and how often they are wrong.</p></div><div class="card"><div class="kicker">During</div><h3>Listen as hard as you look.</h3><p>The dialogue is doing double duty: period flavor on the surface, strategy underneath. Notice repeated phrases, hats, rooms, thresholds and the way violence interrupts otherwise controlled scenes.</p></div><div class="card"><div class="kicker">After</div><h3>What did Tom actually choose?</h3><p>Once the machinery is clear, the film becomes less about who won and more about what loyalty costs when nearly every relationship is transactional.</p></div></div><h2>Discussion</h2><ol><li><b>First response:</b> What stayed with you most — a scene, image, performance, line or feeling?</li><li>Is Tom Reagan principled, self-protective, loyal, manipulative — or some unstable mix of all four?</li><li>Where does the film reward a second viewing most: plot, dialogue, performance, visual design or moral ambiguity?</li><li>Which relationship actually carries the emotional weight of the movie?</li><li>Does the film romanticize the gangster world, puncture it, or somehow do both at once?</li><li>After scoring it, what category would move the most if you watched it again?</li></ol>`}
(async()=>{const {data,error}=await ltDb.rpc('get_next_watch');if(error||!data){main.innerHTML='<p>No next watch is set yet.</p>';return}let body=(data.title==="Miller's Crossing"&&Number(data.year)===1990)?millers():`<div class="kicker">Next Watch</div><h2>${esc(data.title)}${data.year?` <span class="meta">(${data.year})</span>`:''}</h2><p><b>Picked by ${esc(data.picker||'—')}.</b></p><p>Pre-watch notes and discussion prompts are coming next.</p>`;body+=`<div class="card" style="margin-top:18px"><div class="kicker">Picker's note</div><p id="pickerNote">Why this one?</p><div id="pickerEdit" class="hide"><textarea id="note" placeholder="A sentence or two from the picker — why this film, why now?"></textarea><button class="btn" id="saveNote" type="button">Save Note</button></div></div>`;main.innerHTML=body;const who=localStorage.getItem('lt_person');if(who===data.picker){document.getElementById('pickerEdit').classList.remove('hide');document.getElementById('saveNote').onclick=async()=>{const note=document.getElementById('note').value.trim();const r=await ltDb.rpc('set_next_watch_picker_note',{p_watch_event:data.watch_event_id,p_picker:who,p_note:note});if(!r.error){document.getElementById('pickerNote').textContent=note||'Why this one?';document.getElementById('pickerEdit').classList.add('hide')}}}})();
</script></body></html>
