<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Critic Cards</title><link rel="stylesheet" href="/styles.css?v=116"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=116"></script></head><body><div class="wrap"><div id="mast"></div><h1>Critic Cards</h1><p class="lede">The record so far. Scores, picks, nominations and a few things you actually said.</p><div id="tabs" class="tabs"></div><div id="main" class="card">Loading the record…</div><div class="footer">Missing a screening costs nothing. No scoring from memory just to fill a hole. <span class="meta">Build v1.1.6</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const order=['Greg','Keith','David','Steele','Will'];
let rows=[],extras=[];
function avg(arr,key){const v=arr.map(x=>x[key]).filter(x=>x!=null).map(Number);return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null}
function totalAvg(arr){const v=arr.map(x=>x.total_40).filter(x=>x!=null).map(Number);return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null}
function totalClass(v){if(v==null)return 'total-none';v=Number(v);return v>=35?'total-great':v>=30?'total-good':v>=24?'total-mid':'total-low'}
function filmList(items,max=6){if(!items?.length)return '<span class="meta">None yet.</span>';return items.slice(0,max).map(x=>`<span class="chip">${esc(x.title)}${x.year?' ('+x.year+')':''}</span>`).join(' ')}
function commentsList(items){if(!items?.length)return '<p class="meta">No written takes yet.</p>';return items.slice(0,3).map(x=>`<blockquote style="margin:12px 0;padding-left:14px;border-left:2px solid var(--line)"><b>${esc(x.title)}${x.year?' ('+x.year+')':''}</b>${x.what_is_it?`<div>${esc(x.what_is_it)}</div>`:''}${x.takeaway?`<div class="meta">“${esc(x.takeaway)}”</div>`:''}</blockquote>`).join('')}
function directorList(items){if(!items?.length)return '<span class="meta">None yet.</span>';return items.map(x=>`<span class="chip">${esc(x.name||x.title||x)}</span>`).join(' ')}
function singleFilm(f){return f?.title?`${esc(f.title)}${f.year?' ('+f.year+')':''}`:'—'}
function profileSection(p){
  if(!p||!p.favorite_films_today)return `<div class="card" style="margin-top:18px"><div class="kicker">Starting Point</div><p class="meta">Critic Card starter not filled out yet.</p></div>`;
  return `<div class="card profile-card" style="margin-top:18px"><div class="kicker">Starting Point</div><h3>What they say they like</h3><div class="profile-row"><b>Five favorites — today</b><div>${filmList(p.favorite_films_today,5)}</div></div><div class="profile-row"><b>Would watch tonight</b><div>${filmList(p.watch_tonight,3)}</div></div><div class="profile-row"><b>Favorite directors</b><div>${directorList(p.favorite_directors)}</div></div><div class="profile-row"><b>Favorite genres</b><div>${(p.favorite_genres||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join(' ')||'—'}</div></div><div class="profile-grid"><div><span class="meta">Underrated</span><br><b>${singleFilm(p.underrated)}</b></div><div><span class="meta">Overrated</span><br><b>${singleFilm(p.overrated)}</b></div><div><span class="meta">Will defend</span><br><b>${singleFilm(p.defend_to_club)}</b></div><div><span class="meta">Doesn’t fit</span><br><b>${singleFilm(p.surprise_favorite)}</b></div></div><div class="profile-row"><b>What makes a film rewatchable?</b><div>${esc(p.rewatch_definition||'—')}</div></div></div>`;
}
function render(name){
  const mine=rows.filter(r=>r.display_name===name),ex=extras.find(x=>x.name===name)||{};
  tabs.innerHTML=order.map(n=>`<button class="tab ${n===name?'active':''}" data-name="${n}">${n}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.name));
  const rated=mine.filter(r=>r.overall!=null),ta=totalAvg(rated);
  const stats=`<div class="grid"><div class="card total-box ${totalClass(ta)}"><div class="kicker">Avg Total</div><h2>${ta==null?'—':ta.toFixed(1)+' / 40'}</h2></div><div class="card"><div class="kicker">Club Films Scored</div><h2>${rated.length}</h2></div><div class="card"><div class="kicker">Avg Overall</div><h2>${fmt(avg(rated,'overall'))}</h2></div><div class="card"><div class="kicker">Club Points</div><h2>${Number(ex.points||0)}</h2><div class="meta">+1 rating · +1 nomination · +1 pick</div></div></div><div class="points-note"><b>Club Points reward participation, not perfection.</b> You earn them by watching, rating, nominating and picking films. No penalties for missed screenings, and newer members aren't expected to catch up to people who've been here longer. Life gets in the way; regular participation matters more than perfect attendance.</div>`;
  const table=`<div style="overflow-x:auto;margin-top:18px"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">Club film</th><th>Total / 40</th><th>Craft</th><th>Impact</th><th>RW</th><th>Overall</th></tr></thead><tbody>${mine.map(r=>`<tr><td style="padding:12px 8px;border-top:1px solid #cdbfa9"><b>${esc(r.title)}</b> <span class="meta">${r.year||''}</span>${r.canon?' <span class="meta">· Canon</span>':''}${Number(r.rating_count)>1?` <span class="meta">· ${r.rating_count} ratings</span>`:''}${r.legacy_incomplete?' <span class="meta">· legacy</span>':''}</td><td style="text-align:center;border-top:1px solid #cdbfa9"><span class="total-pill ${totalClass(r.total_40)}">${r.total_40==null?'—':Number(r.total_40).toFixed(1)}</span></td><td style="text-align:center;border-top:1px solid #cdbfa9">${fmt(r.craft)}</td><td style="text-align:center;border-top:1px solid #cdbfa9">${fmt(r.emotional_impact)}</td><td style="text-align:center;border-top:1px solid #cdbfa9">${fmt(r.rewatchability)}</td><td style="text-align:center;border-top:1px solid #cdbfa9">${fmt(r.overall)}</td></tr>`).join('')}</tbody></table></div>`;
  const trail=`<div class="grid" style="margin-top:18px"><div class="card"><div class="kicker">Nominated</div><p>${filmList(ex.nomination_films)}</p></div><div class="card"><div class="kicker">Picked for the Club</div><p>${filmList(ex.pick_films)}</p></div></div>`;
  main.innerHTML=`<div class="kicker">${esc(name)}</div><h2>${esc(name)}'s Critic Card</h2>${stats}${profileSection(ex.profile_starter)}${table}${trail}<div class="card" style="margin-top:18px"><div class="kicker">In Their Own Words</div>${commentsList(ex.comments)}</div>`;
}
(async()=>{const [a,b]=await Promise.all([ltDb.rpc('get_critic_scorecards'),ltDb.rpc('get_critic_card_extras')]);if(a.error||b.error){main.innerHTML='<p>Could not load Critic Cards.</p>';return}rows=a.data||[];extras=b.data||[];const requested=new URLSearchParams(location.search).get('critic');const who=order.includes(requested)?requested:currentPerson();render(order.includes(who)?who:'Greg')})();
</script><style>.chip{display:inline-block;border:1px solid var(--line);padding:5px 8px;margin:2px 2px 2px 0;font-size:12px}.total-box{border-width:2px}.total-pill{display:inline-block;min-width:52px;padding:6px 8px;border-radius:6px;font-weight:800}.total-low{background:#f1d8d1}.total-mid{background:#f2e1b8}.total-good{background:#d8e5cf}.total-great{background:#bdd6c2}.total-none{background:var(--paper2)}.points-note{margin-top:10px;padding:10px 12px;border-left:2px solid var(--line);font-size:12px;line-height:1.45;color:var(--muted)}.profile-card h3{margin:5px 0 14px}.profile-row{padding:10px 0;border-top:1px solid var(--line)}.profile-row>b{display:block;margin-bottom:6px}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px 0;border-top:1px solid var(--line)}.profile-grid>div{padding:8px;background:var(--paper2)}@media(max-width:600px){.profile-grid{grid-template-columns:1fr}}</style></body></html>
