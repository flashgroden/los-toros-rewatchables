<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Finish Your Take</title><link rel="stylesheet" href="/styles.css?v=113"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=113"></script></head><body><div class="wrap"><div id="mast"></div><h1>Finish Your Take</h1><p class="lede">The numbers are locked. Give us the part only you can write.</p><div id="main" class="card">Loading…</div><div id="msg" class="notice hide"></div><div id="reveal" class="hide"></div><div class="footer">Shared watch. Not an official Los Toros club screening. <span class="meta">Build v1.1.3</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const main=document.getElementById('main'),msg=document.getElementById('msg'),reveal=document.getElementById('reveal');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const qp=new URLSearchParams(location.search),slug=qp.get('watch'),name=qp.get('who')||currentPerson();
let room=null,rating=null;
function total(r){return Number(r.craft||0)+Number(r.impact||0)+Number(r.rewatch||0)+Number(r.overall||0)}
function card(r){return `<div class="card"><h3>${esc(r.name||'—')}</h3><div class="statline"><div class="stat"><b>${fmt(r.craft)}</b>Craft</div><div class="stat"><b>${fmt(r.impact)}</b>Impact</div><div class="stat"><b>${fmt(r.rewatch)}</b>Rewatch</div><div class="stat"><b>${fmt(r.overall)}</b>Overall</div><div class="stat"><b>${fmt(total(r))}</b>Total / 40</div></div>${r.what_is_it?`<p><b>What is it?</b> ${esc(r.what_is_it)}</p>`:''}${r.takeaway?`<p><b>Takeaway:</b> ${esc(r.takeaway)}</p>`:''}</div>`}
async function showReveal(){const rr=await ltDb.rpc('get_shared_reveal',{p_watch_event:room.watch_event_id,p_rating_id:rating.rating_id});if(rr.error)return;const rows=rr.data?.ratings||[];if(!rows.length)return;reveal.classList.remove('hide');reveal.innerHTML=`<h2>The Reveal</h2><p class="lede">Now the argument can begin.</p><div class="compare-grid">${rows.map(card).join('')}</div>`}
(async()=>{
 if(!slug||!name){main.innerHTML='<p>Missing the film or critic name.</p>';return}
 if(MEMBERS.includes(name))setCurrentPerson(name);
 const sw=await ltDb.rpc('get_shared_watch',{p_slug:slug});if(sw.error||!sw.data){main.innerHTML='<p>This shared watch is not available.</p>';return}room=sw.data;
 const mr=await ltDb.rpc('get_shared_rating_for_reviewer',{p_watch_event:room.watch_event_id,p_reviewer:name});if(mr.error||!mr.data){main.innerHTML=`<p>No locked score found for ${esc(name)} on ${esc(room.title)}.</p>`;return}rating=mr.data;
 main.innerHTML=`<div class="kicker">${esc(name)}</div><h2>${esc(room.title)}${room.year?' ('+room.year+')':''}</h2><p>Your score is already in:</p>${card(rating)}<form id="notesForm"><div class="field"><label>What is this film?</label><textarea id="what" placeholder="Your short description">${esc(rating.what_is_it||'')}</textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="The thing you'd say walking out">${esc(rating.takeaway||'')}</textarea></div><button class="btn" type="submit">Save My Take</button></form>`;
 document.getElementById('notesForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Saving…';const r=await ltDb.rpc('update_shared_rating_notes',{p_rating:rating.rating_id,p_reviewer:name,p_what:document.getElementById('what').value,p_takeaway:document.getElementById('takeaway').value});b.disabled=false;b.textContent='Save My Take';if(r.error||!r.data){showMsg(msg,'Could not save your take.','error');return}rating.what_is_it=document.getElementById('what').value.trim();rating.takeaway=document.getElementById('takeaway').value.trim();showMsg(msg,'Saved. Now you can see the other score.','success');showReveal()};
 if(rating.what_is_it||rating.takeaway)showReveal();
})();
</script><style>.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.statline{display:flex;gap:16px;flex-wrap:wrap}.stat b{display:block;font-size:24px}</style></body></html>
