<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Critic Cards</title><link rel="stylesheet" href="/styles.css?v=113"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=113"></script></head><body><div class="wrap"><div id="mast"></div><h1>Critic Cards</h1><p class="lede">The record so far. Scores, picks, nominations and a few things you actually said.</p><div id="tabs" class="tabs"></div><div id="main" class="card">Loading the record…</div><div class="footer">Missing a screening costs nothing. No scoring from memory just to fill a hole. <span class="meta">Build v1.1.3</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const order=['Greg','Keith','David','Steele','Will'];
let rows=[],extras=[];
function avg(arr,key){const v=arr.map(x=>x[key]).filter(x=>x!=null).map(Number);return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null}
function totalAvg(arr){const v=arr.map(x=>x.total_40).filter(x=>x!=null).map(Number);return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null}
function filmList(items,max=6){if(!items?.length)return '<span class="meta">None yet.</span>';return items.slice(0,max).map(x=>`<span class="chip">${esc(x.title)}${x.year?' ('+x.year+')':''}</span>`).join(' ')}
function commentsList(items){if(!items?.length)return '<p class="meta">No written takes yet.</p>';return items.slice(0,3).map(x=>`<blockquote style="margin:12px 0;padding-left:14px;border-left:2px solid var(--line)"><b>${esc(x.title)}${x.year?' ('+x.year+')':''}</b>${x.what_is_it?`<div>${esc(x.what_is_it)}</div>`:''}${x.takeaway?`<div class="meta">“${esc(x.takeaway)}”</div>`:''}</blockquote>`).join('')}
function render(name){
  const mine=rows.filter(r=>r.display_name===name),ex=extras.find(x=>x.name===name)||{};
  tabs.innerHTML=order.map(n=>`<button class="tab ${n===name?'active':''}" data-name="${n}">${n}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.name));
  const rated=mine.filter(r=>r.overall!=null);
  const stats=`<div class="grid"><div class="card"><div class="kicker">Club Films Scored</div><h2>${rated.length}</h2></div><div class="card"><div class="kicker">Avg Total</div><h2>${totalAvg(rated)==null?'—':totalAvg(rated).toFixed(1)+' / 40'}</h2></div><div class="card"><div class="kicker">Avg Overall</div><h2>${fmt(avg(rated,'overall'))}</h2></div><div class="card"><div class="kicker">Club Points</div><h2>${Number(ex.points||0)}</h2><div class="meta">+1 rating · +1 nomination · +1 pick</div></div></div>`;
  const table=`<div style="overflow-x:auto;margin-top:18px"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">Club film</th><th>Craft</th><th>Impact</th><th>RW</th><th>Overall</th><th>Total</th></tr></thead><tbody>${mine.map(r=>`<tr><td style="padding:12px 8px;border-top:1px solid #cdbfa9"><b>${esc(r.title)}</b> <span class="meta">${r.year||''}</span>${r.canon?' <span class="meta">· Canon</span>':''}${Number(r.rating_count)>1?` <span class="meta">· ${r.rating_count} ratings</span>`:''}${r.legacy_incomplete?' <span class="meta">· legacy</span>':''}</td><td style="text-align:center;border-top:1px solid #cdbfa9">${fmt(r.craft)}</td><td style="text-align:center;border-top:1px solid #cdbfa9">${fmt(r.emotional_impact)}</td><td style="text-align:center;border-top:1px solid #cdbfa9">${fmt(r.rewatchability)}</td><td style="text-align:center;border-top:1px solid #cdbfa9">${fmt(r.overall)}</td><td style="text-align:center;border-top:1px solid #cdbfa9"><b>${r.total_40==null?'—':Number(r.total_40).toFixed(1)+'/40'}</b></td></tr>`).join('')}</tbody></table></div>`;
  const trail=`<div class="grid" style="margin-top:18px"><div class="card"><div class="kicker">Nominated</div><p>${filmList(ex.nomination_films)}</p></div><div class="card"><div class="kicker">Picked for the Club</div><p>${filmList(ex.pick_films)}</p></div></div>`;
  main.innerHTML=`<div class="kicker">${esc(name)}</div><h2>${esc(name)}'s Critic Card</h2>${stats}${table}${trail}<div class="card" style="margin-top:18px"><div class="kicker">In Their Own Words</div>${commentsList(ex.comments)}</div>`;
}
(async()=>{const [a,b]=await Promise.all([ltDb.rpc('get_critic_scorecards'),ltDb.rpc('get_critic_card_extras')]);if(a.error||b.error){main.innerHTML='<p>Could not load Critic Cards.</p>';return}rows=a.data||[];extras=b.data||[];const who=currentPerson();render(order.includes(who)?who:'Greg')})();
</script><style>.chip{display:inline-block;border:1px solid var(--line);padding:5px 8px;margin:2px 2px 2px 0;font-size:12px}</style></body></html>
