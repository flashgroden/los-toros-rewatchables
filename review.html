<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Rate a Film</title><link rel="stylesheet" href="styles.css?v=101"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=101"></script></head><body><div class="wrap"><div id="mast"></div><h1>Rate a Film</h1><p class="lede">Any film. Any time. Score first. Compare second.</p><div class="notice">Members and guests can rate anything. Rating does not nominate a film or affect The Dennis / Queue.</div><form id="form"><div class="field"><label>Find the film</label><input id="filmSearch" autocomplete="off" placeholder="Start typing: The Thing, Heat, Cape Fear…"><div id="lookupStatus" class="meta" style="margin-top:6px">Type at least 3 letters, then choose the correct movie.</div><div id="matches" class="lookup-grid"></div><div id="selectedFilm" class="notice success hide"></div></div><div class="field"><label>You</label><select id="who" required></select></div><div id="guestField" class="field hide"><label>Guest / friend name</label><input id="guestName" placeholder="Name"></div><div id="scores"></div><div class="field"><label>What is this film?</label><textarea id="what" placeholder="Your short description"></textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="The thing you'd say walking out"></textarea></div><button class="btn" type="submit">Lock My Scores</button></form><div id="msg" class="notice hide"></div><div id="reveal" class="hide"></div><div class="footer">Score only. Nomination is separate. <span class="meta">Build v1.0.1</span></div></div><script src="common.js?v=101"></script><script>
document.getElementById('mast').innerHTML=mast();
const who=document.getElementById('who'),guestField=document.getElementById('guestField'),guestName=document.getElementById('guestName'),filmSearch=document.getElementById('filmSearch'),matches=document.getElementById('matches'),lookupStatus=document.getElementById('lookupStatus'),selectedFilmEl=document.getElementById('selectedFilm'),scores=document.getElementById('scores'),form=document.getElementById('form'),msg=document.getElementById('msg'),reveal=document.getElementById('reveal');
who.innerHTML='<option value="">Choose…</option>'+memberOptions(true);who.onchange=()=>guestField.classList.toggle('hide',who.value!=='__guest');
const cats=[['craft','Craft','How well does it execute the craft of cinema?'],['impact','Emotional Impact','How did it land emotionally?'],['rewatch','Rewatchability','Do you want to live with it again?'],['overall','Overall','Bottom line: how much do you love it?']];scores.innerHTML=cats.map(([id,n,d])=>`<div class="score-row"><div><label>${n}</label><div class="meta">${d}</div><input id="${id}" type="range" min="1" max="10" step="0.1" value="7" oninput="document.getElementById('${id}N').textContent=Number(this.value).toFixed(1)"></div><div id="${id}N" class="num">7.0</div></div>`).join('');
let selected=null,timer=null,seq=0;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function chooseFilm(f){selected=f;filmSearch.value=`${f.title}${f.year?' ('+f.year+')':''}`;selectedFilmEl.innerHTML=`<b>${esc(f.title)}${f.year?' ('+f.year+')':''}</b>${f.director?` · ${esc(f.director)}`:''}${f.genre?`<div class="meta">${esc(f.genre)}</div>`:''}${f.blurb?`<div class="meta" style="margin-top:6px">${esc(f.blurb)}</div>`:''}`;selectedFilmEl.classList.remove('hide');matches.innerHTML='';lookupStatus.textContent='Film selected.'}
async function searchFilms(){const q=filmSearch.value.trim();selected=null;selectedFilmEl.classList.add('hide');if(q.length<3){matches.innerHTML='';lookupStatus.textContent='Type at least 3 letters, then choose the correct movie.';return}const mine=++seq;lookupStatus.textContent='Searching movies…';try{const arr=await publicMovieSearch(q);if(mine!==seq)return;if(!arr.length){matches.innerHTML='';lookupStatus.textContent='No movie match yet — add a few more letters.';return}lookupStatus.textContent='Choose the right movie:';matches.innerHTML=arr.map((f,i)=>`<button type="button" class="lookup-card" data-i="${i}"><b>${esc(f.title)}${f.year?' ('+f.year+')':''}</b><span>${esc([f.director,f.genre].filter(Boolean).join(' · '))}</span></button>`).join('');matches.querySelectorAll('.lookup-card').forEach(b=>b.onclick=()=>chooseFilm(arr[Number(b.dataset.i)]))}catch(e){console.error('lookup failed',e);lookupStatus.textContent='Movie search hit a network error. Try once more.';matches.innerHTML=''}}
filmSearch.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(searchFilms,650)});const qp=new URLSearchParams(location.search);if(qp.get('film')){filmSearch.value=qp.get('film');setTimeout(searchFilms,50)}
form.onsubmit=async e=>{e.preventDefault();const btn=e.submitter;if(!selected){showMsg(msg,'Choose the correct movie first.','error');return}let reviewer=who.value==='__guest'?guestName.value.trim():who.value;if(!reviewer){showMsg(msg,'Add your name first.','error');return}btn.disabled=true;btn.textContent='Saving…';const {error}=await ltDb.rpc('submit_movie_rating',{p_title:selected.title,p_year:selected.year||null,p_reviewer:reviewer,p_craft:Number(craft.value),p_impact:Number(impact.value),p_rewatch:Number(rewatch.value),p_overall:Number(overall.value),p_what:what.value.trim()||null,p_takeaway:takeaway.value.trim()||null,p_watch_event:null});btn.disabled=false;btn.textContent='Lock My Scores';if(error){showMsg(msg,error.message,'error');return}showMsg(msg,'Locked.','success');reveal.classList.remove('hide');reveal.innerHTML=`<h2>Your scorecard</h2><div class="card"><h3>${esc(selected.title)}${selected.year?' ('+selected.year+')':''}</h3><div class="statline">${cats.map(([id,n])=>`<div class="stat"><b>${Number(document.getElementById(id).value).toFixed(1)}</b>${n}</div>`).join('')}</div></div>`};
</script><style>.lookup-grid{display:grid;gap:8px;margin-top:10px}.lookup-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper2);padding:12px;font:inherit;color:var(--ink);cursor:pointer}.lookup-card:hover{border-color:var(--ink)}.lookup-card b,.lookup-card span{display:block}.lookup-card span{font-size:11px;color:var(--muted);margin-top:3px}</style></body></html>
