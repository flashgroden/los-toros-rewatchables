<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — The Board</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script></head><body><div class="wrap"><div id="mast"></div><h1>The Board</h1><p class="lede">Not the best movies. The ones worth coming back to — and why.</p><div id="status" class="notice hide"></div><div class="tabs"><button class="tab active" data-tab="queue">Queue</button><button class="tab" data-tab="hopper">The Hopper</button><button class="tab" data-tab="watched">Watched</button><button class="tab" data-tab="canon">Canon</button><button class="tab" data-tab="best">Best Rated</button></div><div id="panel"></div><div class="footer"><div class="tagline">Los Toros is not about deciding which movies are best. It’s about discovering which movies are worth coming back to—and why.</div></div></div><script src="/common.js"></script><script>
document.getElementById('mast').innerHTML=mast();
const panel=document.getElementById('panel'), statusEl=document.getElementById('status');let data={queue:[],hopper:[],screenings:[],best:[]},tab='queue';
function rowMovie(x,mode){if(mode==='nom')return `<div class="film-row"><div class="film-title">${x.title}</div><div><span class="pill">${x.member_supports} member${x.member_supports==1?'':'s'}</span></div><div></div></div>`;return `<div class="film-row"><div class="film-title">${x.title}${x.year?` <span class="meta">(${x.year})</span>`:''}</div><div>${fmt(x.avg_overall)}</div><div>${fmt(x.avg_rewatchability)}</div><div>${fmt(x.avg_craft)}</div><div>${fmt(x.avg_impact)}</div><div>${fmt(x.avg_four_category_score)}</div></div>`}
function render(){if(tab==='queue'||tab==='hopper'){const arr=data[tab];panel.innerHTML=`<div class="notice">${tab==='queue'?'2+ core members have backed these. Next picker chooses from here.':'One member has put these forward. One more member moves a film to the Queue.'}</div>`+(arr.length?arr.map(x=>rowMovie(x,'nom')).join(''):'<div class="card">Nothing here yet.</div>');return}if(tab==='watched'||tab==='canon'){const arr=data.screenings.filter(x=>tab==='watched'?x.official:x.canon);panel.innerHTML=`<div class="film-row head"><div>Film</div><div>Overall</div><div>RW</div><div>Craft</div><div>Impact</div><div>Score</div></div>`+(arr.length?arr.map(x=>rowMovie(x)).join(''):'<div class="card">Nothing here yet.</div>');return}panel.innerHTML=`<div class="notice">All member ratings, whether or not the film made Canon. Admired-but-not-rewatchable movies still get their due.</div><div class="film-row head"><div>Film</div><div>Overall</div><div>RW</div><div>Craft</div><div>Impact</div><div>Score</div></div>`+(data.best.length?data.best.map(x=>rowMovie(x)).join(''):'<div class="card">No ratings yet.</div>')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
(async()=>{try{if(!ltDb)throw new Error('Database client did not initialize');const [q,h,s,b]=await Promise.all([ltDb.from('current_nomination_status').select('*').eq('nomination_status','Queue'),ltDb.from('current_nomination_status').select('*').eq('nomination_status','Hopper'),ltDb.from('club_screening_summary').select('*').order('starts_at',{ascending:false}),ltDb.from('film_member_rating_summary').select('*').order('avg_four_category_score',{ascending:false})]);for(const r of[q,h,s,b])if(r.error)throw r.error;data={queue:q.data||[],hopper:h.data||[],screenings:s.data||[],best:b.data||[]};render()}catch(e){showMsg(statusEl,'The board could not load yet: '+e.message,'error')}})();
</script></body></html>
