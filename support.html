<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Support a Film</title><link rel="stylesheet" href="styles.css?v=104"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=104"></script></head><body><div class="wrap"><div id="mast"></div><h1>Move it up the Queue</h1><p class="lede">Already nominated. Now tell the group you want to see it.</p><div id="film" class="card">Loading film…</div><form id="form"><div class="field"><label>Your name</label><select id="member" required></select></div><div class="field"><label>Why this one? (optional)</label><textarea id="note" placeholder="Why should this move closer to the top?"></textarea></div><button class="btn" type="submit">Support this film</button></form><div id="msg" class="notice hide"></div><div class="footer">Each core member can support a Queue film once. More support moves it higher. <span class="meta">Build v1.0.4</span></div></div><script src="common.js?v=104"></script><script>
document.getElementById('mast').innerHTML=mast();
const filmEl=document.getElementById('film'),member=document.getElementById('member'),note=document.getElementById('note'),form=document.getElementById('form'),msg=document.getElementById('msg');
member.innerHTML='<option value="">Choose…</option>'+memberOptions(false);
const qp=new URLSearchParams(location.search),title=qp.get('title'),year=qp.get('year');let selected=null;
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
(async()=>{if(!title){filmEl.textContent='Film not found.';form.classList.add('hide');return}let q=ltDb.from('current_nomination_status').select('*').eq('title',title);if(year)q=q.eq('year',Number(year));const {data,error}=await q.limit(1);if(error||!data?.length){filmEl.textContent='Film not found in the current Queue.';form.classList.add('hide');return}selected=data[0];filmEl.innerHTML=`<div class="kicker">Queue · ${selected.member_supports} supporter${selected.member_supports===1?'':'s'}</div><h3>${esc(selected.title)}${selected.year?` (${selected.year})`:''}</h3>${selected.director?`<div class="meta">${esc(selected.director)}${selected.genre?` · ${esc(selected.genre)}`:''}</div>`:''}${selected.blurb?`<p>${esc(selected.blurb)}</p>`:''}<div class="meta"><b>Current support:</b> ${esc(selected.nominators||'—')}</div>`})();
form.onsubmit=async e=>{e.preventDefault();if(!selected)return;const btn=e.submitter;btn.disabled=true;btn.textContent='Saving…';const {data,error}=await ltDb.rpc('nominate_movie',{p_title:selected.title,p_year:selected.year||null,p_member:member.value,p_director:selected.director||null,p_genre:selected.genre||null,p_rt:null,p_note:note.value.trim()||null,p_times_seen:null,p_blurb:selected.blurb||null});btn.disabled=false;btn.textContent='Support this film';if(error){showMsg(msg,error.message,'error');return}showMsg(msg,`${selected.title} has your support.`, 'success');};
</script></body></html>
