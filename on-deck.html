<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — On Deck</title><link rel="stylesheet" href="/styles.css?v=112"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=112"></script></head><body><div class="wrap"><div id="mast"></div><h1>On Deck</h1><p class="lede">Private picker prep. Just enough context to sharpen the conversation without turning movie night into homework.</p><div id="main" class="card">Loading next watch…</div><div class="footer">Build v1.1.2</div></div><script src="/common.js?v=111"></script><script>
document.getElementById('mast').innerHTML=mast();const main=document.getElementById('main');const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function barry(){return `<div class="kicker">Next Watch</div><h2>Barry Lyndon <span class="meta">(1975)</span></h2><p><b>Picked by Greg · PFA.</b></p><div class="grid"><div class="card"><div class="kicker">Before</div><h3>Watch the distance.</h3><p>Kubrick gives us an epic rise-and-fall saga, but he keeps stepping backward from Barry — literally and emotionally. The painterly compositions, narrator and slow zooms make us watch a man being absorbed by class, ambition and history rather than simply identify with him.</p></div><div class="card"><div class="kicker">During</div><h3>Look beyond the candlelight.</h3><p>The natural-light photography is legendary, but notice what the formal beauty is doing: ritual, status, costume, rooms, military formations, faces and music keep reducing individual desire to something almost absurd. Also: let yourself notice how funny the movie is.</p></div><div class="card"><div class="kicker">After</div><h3>Where does the feeling live?</h3><p>Early critics often called the film cold or emotionally distant; its reputation has since risen dramatically. Ask whether the distance actually creates the sadness — and whether Barry's striving, status anxiety and self-invention feel more contemporary than the powdered wigs suggest.</p></div></div><h2>Discussion</h2><ol><li><b>What is Kubrick making us feel by refusing the usual intimacy of an epic?</b> Does the beauty create distance, emotion — or both?</li><li><b>What makes <i>Barry Lyndon</i> feel relevant now?</b> Class mobility, status performance, masculinity, ambition, inherited privilege, something else?</li><li><b>Where does it sit in Kubrick?</b> If you had to argue for it against <i>Strangelove</i>, <i>2001</i>, <i>Clockwork Orange</i>, <i>The Shining</i>, etc., what is the particular thing this film does better than the others?</li></ol>`}
function millers(){return `<div class="kicker">Next Watch</div><h2>Miller's Crossing <span class="meta">(1990)</span></h2><p><b>Picked by Will.</b></p><div class="grid"><div class="card"><div class="kicker">Before</div><h3>Watch the alliances.</h3><p>The Coens build this gangster film around loyalty, leverage and misdirection. Pay attention to who thinks they understand Tom Reagan — and how often they are wrong.</p></div><div class="card"><div class="kicker">During</div><h3>Listen as hard as you look.</h3><p>The dialogue is doing double duty: period flavor on the surface, strategy underneath. Notice repeated phrases, hats, rooms, thresholds and the way bursts of violence interrupt otherwise controlled scenes.</p></div><div class="card"><div class="kicker">After</div><h3>What did Tom actually choose?</h3><p>Some critics admired the extraordinary craft while finding the film overly designed or emotionally elusive; others see the genre machinery as camouflage for a painful story about friendship, character and ethics. Decide which film you saw.</p></div></div><h2>Discussion</h2><ol><li><b>What is Tom Reagan actually loyal to?</b> A person, a code, his own survival, the pleasure of being the smartest man in the room — or some unstable mix?</li><li><b>Where is the emotion hiding?</b> Beneath the dialogue and plotting, which relationship carries the real weight of the film?</li><li><b>Where does it sit among the Coens?</b> What does <i>Miller's Crossing</i> reveal about their recurring interests — language, idiots and schemers, fate, morality, genre — that helps distinguish it from their other best films?</li></ol>`}
(async()=>{const {data,error}=await ltDb.rpc('get_next_watch');if(error||!data){main.innerHTML='<p>No next watch is set yet.</p>';return}const who=currentPerson();if(!who){main.innerHTML=`<h2>${esc(data.title)}${data.year?` <span class="meta">(${data.year})</span>`:''}</h2><p>This is the picker’s private prep page.</p><p><b>Pick your name above.</b> If you’re ${esc(data.picker||'the picker')}, the host card will open.</p>`;return}if(who!==data.picker){main.innerHTML=`<h2>${esc(data.title)}${data.year?` <span class="meta">(${data.year})</span>`:''}</h2><p><b>Picked by ${esc(data.picker||'—')}.</b></p><p>This prep belongs to ${esc(data.picker||'the picker')}. You’ll get the movie, not the cheat sheet.</p>`;return}let body=(data.title==='Barry Lyndon'&&Number(data.year)===1975)?barry():(data.title==="Miller's Crossing"&&Number(data.year)===1990)?millers():`<div class="kicker">Next Watch</div><h2>${esc(data.title)}${data.year?` <span class="meta">(${data.year})</span>`:''}</h2><p><b>Picked by ${esc(data.picker||'—')}.</b></p><p>Pre-watch notes and discussion prompts are coming next.</p>`;body+=`<div class="card" style="margin-top:18px"><div class="kicker">Picker's note</div><p id="pickerNote">Why this one?</p><div id="pickerEdit"><textarea id="note" placeholder="A sentence or two — why this film, why now?"></textarea><button class="btn" id="saveNote" type="button">Save Note</button></div></div>`;main.innerHTML=body;document.getElementById('saveNote').onclick=async()=>{const note=document.getElementById('note').value.trim();const r=await ltDb.rpc('set_next_watch_picker_note',{p_watch_event:data.watch_event_id,p_picker:who,p_note:note});if(!r.error){document.getElementById('pickerNote').textContent=note||'Why this one?';document.getElementById('pickerEdit').classList.add('hide')}}})();
</script></body></html>
