<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Rate a Film</title><link rel="stylesheet" href="styles.css?v=106"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=106"></script></head><body><div class="wrap"><div id="mast"></div><h1>Score a Film</h1><p class="lede">Score first. Reveal second. Then argue about it.</p><div id="roomNotice" class="notice"><b>Scoring does not nominate a film.</b> Anyone can score anything. You won’t see anybody else’s scores until you submit yours.</div><form id="form"><div id="filmField" class="field"><label>Find the film</label><input id="filmSearch" autocomplete="off" placeholder="Start typing: Bugonia, Quadrophenia, Taxi Driver…"><div id="lookupStatus" class="meta" style="margin-top:6px">Type at least 3 letters, then choose the correct movie.</div><div id="matches" class="lookup-grid"></div><div id="selectedFilm" class="notice success hide"></div></div><div class="field"><label>You</label><select id="who" required></select></div><div id="guestField" class="field hide"><label>Your name</label><input id="guestName" placeholder="First name + last initial is fine"></div><div id="scores"></div><div class="field"><label>What is this film?</label><textarea id="what" placeholder="Your short description"></textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="The thing you'd say walking out"></textarea></div><button class="btn" type="submit">Lock My Scores</button></form><div id="msg" class="notice hide"></div><div id="reveal" class="hide"></div><div class="footer">Blind scoring: you have to give to get. <span class="meta">Build v1.0.6</span></div></div><script src="common.js?v=106"></script><script>
document.getElementById('mast').innerHTML=mast();
const who=document.getElementById('who'),guestField=document.getElementById('guestField'),guestName=document.getElementById('guestName'),filmField=document.getElementById('filmField'),filmSearch=document.getElementById('filmSearch'),matches=document.getElementById('matches'),lookupStatus=document.getElementById('lookupStatus'),selectedFilmEl=document.getElementById('selectedFilm'),scores=document.getElementById('scores'),form=document.getElementById('form'),msg=document.getElementById('msg'),reveal=document.getElementById('reveal'),roomNotice=document.getElementById('roomNotice');
who.innerHTML='<option value="">Choose…</option>'+memberOptions(true);const remembered=localStorage.getItem('lt_person');if(remembered&&MEMBERS.includes(remembered))who.value=remembered;who.onchange=()=>{guestField.classList.toggle('hide',who.value!=='__guest');if(who.value&&who.value!=='__guest')localStorage.setItem('lt_person',who.value)};
const cats=[['craft','Craft','How fully does the film realize its formal and technical ambitions?'],['impact','Emotional Impact','What force does it carry once it lands?'],['rewatch','Rewatchability','How much do you want — and expect to be rewarded — by returning?'],['overall','Overall','Taken as a whole, how highly do you rate it?']];scores.innerHTML=cats.map(([id,n,d])=>`<div class="score-row"><div><label>${n}</label><div class="meta">${d}</div><input id="${id}" type="range" min="1" max="10" step="0.1" value="7" oninput="document.getElementById('${id}N').textContent=Number(this.value).toFixed(1)"></div><div id="${id}N" class="num">7.0</div></div>`).join('');
let selected=null,timer=null,seq=0,room=null,lockedFilm=false;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function chooseFilm(f,{lock=false}={}){selected=f;filmSearch.value=`${f.title}${f.year?' ('+f.year+')':''}`;selectedFilmEl.innerHTML=`<b>${esc(f.title)}${f.year?' ('+f.year+')':''}</b>${f.director?` · ${esc(f.director)}`:''}${f.blurb?`<div class="meta" style="margin-top:6px">${esc(f.blurb)}</div>`:''}`;selectedFilmEl.classList.remove('hide');matches.innerHTML='';lookupStatus.textContent=lock?'Selected from The Board.':'Film selected.';if(lock){lockedFilm=true;filmSearch.readOnly=true;filmField.classList.add('locked-film')}}
async function loadExact(title,year){let q=ltDb.from('films').select('title,year,director,genre,blurb').eq('title',title);if(year)q=q.eq('year',Number(year));const {data}=await q.limit(1);if(data?.length){chooseFilm(data[0],{lock:true});return}filmSearch.value=title;searchFilms()}
async function searchFilms(){if(lockedFilm)return;const q=filmSearch.value.trim();selected=null;selectedFilmEl.classList.add('hide');if(q.length<3){matches.innerHTML='';lookupStatus.textContent='Type at least 3 letters, then choose the correct movie.';return}const mine=++seq;lookupStatus.textContent='Searching movie titles…';try{const arr=await publicMovieSearch(q);if(mine!==seq)return;if(!arr.length){matches.innerHTML='';lookupStatus.textContent='No title match yet — add a few more letters.';return}lookupStatus.textContent='Choose the right movie:';matches.innerHTML=arr.map((f,i)=>`<button type="button" class="lookup-card" data-i="${i}"><b>${esc(f.title)}${f.year?' ('+f.year+')':''}</b><span>${esc([f.director].filter(Boolean).join(' · '))}</span></button>`).join('');matches.querySelectorAll('.lookup-card').forEach(b=>b.onclick=()=>chooseFilm(arr[Number(b.dataset.i)]))}catch(e){console.error(e);lookupStatus.textContent='Movie search hit a network error. Try again.';matches.innerHTML=''}}
filmSearch.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(searchFilms,450)});
function shareUrl(slug){return `${location.origin}${location.pathname}?watch=${encodeURIComponent(slug)}`}
function avg(rows,key){return rows.reduce((s,r)=>s+Number(r[key]||0),0)/rows.length}
function renderReveal(data,slug,myRating){reveal.classList.remove('hide');const rows=data.ratings||[];if(!data.unlocked){reveal.innerHTML=`<h2>Your scorecard</h2>${scoreCard(rows[0])}<div class="notice"><b>You’re first.</b> Send this film to somebody else. Their scores stay hidden until they submit, then the reveal opens for both of you.</div><div class="sharebox"><input id="shareLink" readonly value="${esc(shareUrl(slug))}"><button class="btn alt" id="copyBtn" type="button">Copy Link</button></div>`;document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(shareUrl(slug));document.getElementById('copyBtn').textContent='Copied'};return}
 const av={craft:avg(rows,'craft'),impact:avg(rows,'impact'),rewatch:avg(rows,'rewatch'),overall:avg(rows,'overall')};
 reveal.innerHTML=`<h2>The Reveal</h2><p class="lede">${rows.length} scores are in. Now you can see where you agreed — and where the movie split the room.</p><div class="compare-grid">${rows.map(scoreCard).join('')}</div><div class="card"><div class="kicker">Room average</div><div class="statline"><div class="stat"><b>${fmt(av.craft)}</b>Craft</div><div class="stat"><b>${fmt(av.impact)}</b>Impact</div><div class="stat"><b>${fmt(av.rewatch)}</b>Rewatch</div><div class="stat"><b>${fmt(av.overall)}</b>Overall</div></div></div><div class="sharebox"><input id="shareLink" readonly value="${esc(shareUrl(slug))}"><button class="btn alt" id="copyBtn" type="button">Invite Another</button></div>`;document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(shareUrl(slug));document.getElementById('copyBtn').textContent='Copied'} }
function scoreCard(r){if(!r)return'';return `<div class="card"><h3>${esc(r.name||'You')}</h3><div class="statline"><div class="stat"><b>${fmt(r.craft)}</b>Craft</div><div class="stat"><b>${fmt(r.impact)}</b>Impact</div><div class="stat"><b>${fmt(r.rewatch)}</b>Rewatch</div><div class="stat"><b>${fmt(r.overall)}</b>Overall</div></div></div>`}
async function loadRoom(slug){const {data,error}=await ltDb.rpc('get_shared_watch',{p_slug:slug});if(error||!data){showMsg(msg,'This shared watch link is no longer available.','error');return}room=data;selected={title:data.title,year:data.year,director:data.director,genre:data.genre,blurb:data.blurb};filmField.classList.add('hide');roomNotice.innerHTML=`<b>${esc(data.title)}${data.year?' ('+data.year+')':''}</b> · Shared watch. Score it blind; the reveal opens after two people submit.`;const stored=localStorage.getItem('lt_rating_'+slug);if(stored){form.classList.add('hide');const rr=await ltDb.rpc('get_shared_reveal',{p_watch_event:data.watch_event_id,p_rating_id:stored});if(!rr.error)renderReveal(rr.data,slug,stored)}}
const qp=new URLSearchParams(location.search),watchSlug=qp.get('watch');if(watchSlug)loadRoom(watchSlug);else if(qp.get('title'))loadExact(qp.get('title'),qp.get('year'));else if(qp.get('film')){filmSearch.value=qp.get('film');setTimeout(searchFilms,50)}
form.onsubmit=async e=>{e.preventDefault();const btn=e.submitter;if(!selected){showMsg(msg,'Choose the correct movie first.','error');return}const reviewer=who.value==='__guest'?guestName.value.trim():who.value;if(!reviewer){showMsg(msg,'Add your name first.','error');return}if(who.value!=='__guest')localStorage.setItem('lt_person',reviewer);btn.disabled=true;btn.textContent='Locking…';try{if(!room){const cr=await ltDb.rpc('create_shared_watch',{p_title:selected.title,p_year:selected.year||null,p_creator:reviewer});if(cr.error)throw cr.error;room={watch_event_id:cr.data.watch_event_id,slug:cr.data.slug,title:selected.title,year:selected.year}}
 const sr=await ltDb.rpc('submit_movie_rating',{p_title:selected.title,p_year:selected.year||null,p_reviewer:reviewer,p_craft:Number(craft.value),p_impact:Number(impact.value),p_rewatch:Number(rewatch.value),p_overall:Number(overall.value),p_what:what.value.trim()||null,p_takeaway:takeaway.value.trim()||null,p_watch_event:room.watch_event_id});if(sr.error)throw sr.error;localStorage.setItem('lt_rating_'+room.slug,sr.data);form.classList.add('hide');showMsg(msg,'Locked. No changing the box score after the game.','success');const rr=await ltDb.rpc('get_shared_reveal',{p_watch_event:room.watch_event_id,p_rating_id:sr.data});if(rr.error)throw rr.error;renderReveal(rr.data,room.slug,sr.data)}catch(err){showMsg(msg,err.message||'Could not save this rating.','error')}finally{btn.disabled=false;btn.textContent='Lock My Scores'}};
</script><style>.lookup-grid{display:grid;gap:8px;margin-top:10px}.lookup-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper2);padding:12px;font:inherit;color:var(--ink);cursor:pointer}.lookup-card:hover{border-color:var(--ink)}.lookup-card b,.lookup-card span{display:block}.lookup-card span{font-size:11px;color:var(--muted);margin-top:3px}.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.sharebox{display:grid;grid-template-columns:1fr auto;gap:8px;margin:18px 0}.sharebox input{font-size:12px}.locked-film input{background:#eee6d6;cursor:default}@media(max-width:600px){.sharebox{grid-template-columns:1fr}}</style></body></html>
