<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Director Ladder</title><link rel="stylesheet" href="/styles.css?v=120"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=120"></script></head><body><div class="wrap"><div id="mast"></div><div class="ladder-head"><div><div class="eyebrow">DIRECTOR LADDER</div><h1 id="title">Loading…</h1><p class="lede" id="sub"></p></div><a id="back" class="btn ghost" href="/critics.html">Back to Critic Card</a></div><div class="tabs" id="directorTabs"></div><div id="main" class="card">Loading filmography…</div><div class="footer">Rank what you've seen. Leave the rest unranked. The record can change as the movies do. <span class="meta">Build v1.2.0</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const qs=new URLSearchParams(location.search),who=qs.get('critic')||currentPerson()||'Greg';let director=qs.get('director')||'kubrick';
const main=document.getElementById('main'),title=document.getElementById('title'),sub=document.getElementById('sub'),tabs=document.getElementById('directorTabs'),back=document.getElementById('back');
back.href='/critics.html?critic='+encodeURIComponent(who);
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const labels={kubrick:'Stanley Kubrick','coen-brothers':'Coen Brothers'};
function total(r){return r.total_40==null?null:Number(r.total_40)}
function scoreLine(r){if(total(r)==null)return '<span class="meta">Unscored</span>';return `<b>${total(r).toFixed(1)} /40</b> · C ${Number(r.craft).toFixed(1)} · I ${Number(r.emotional_impact).toFixed(1)} · RW ${Number(r.rewatchability).toFixed(1)} · O ${Number(r.overall).toFixed(1)}`}
function viewingLine(r){const bits=[];if(r.times_seen_bucket)bits.push('Seen '+r.times_seen_bucket+'×');else if(Number(r.viewing_count)>0)bits.push('At least '+r.viewing_count+' club view'+(Number(r.viewing_count)===1?'':'s'));if(r.last_venue)bits.push('Last: '+r.last_venue);return bits.length?bits.join(' · '):'No viewing memory added yet.'}
async function save(r){const rankEl=document.getElementById('rank-'+r.film_id),seenEl=document.getElementById('seen-'+r.film_id),btn=document.getElementById('save-'+r.film_id);btn.disabled=true;btn.textContent='Saving…';const {error}=await ltDb.rpc('save_director_ladder_entry',{p_reviewer:who,p_director:director,p_film:r.film_id,p_rank:rankEl.value?Number(rankEl.value):null,p_times_seen:seenEl.value||null});btn.disabled=false;btn.textContent=error?'Try Again':'Saved';if(error)alert(error.message);else setTimeout(()=>btn.textContent='Save',700)}
async function load(){title.textContent=labels[director]||director;sub.textContent=`${who}'s ladder — personal ranking, Los Toros score, and approximate viewing history.`;tabs.innerHTML=['kubrick','coen-brothers'].map(d=>`<button class="tab ${d===director?'active':''}" data-d="${d}">${labels[d]}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{director=b.dataset.d;const u=new URL(location.href);u.searchParams.set('director',director);history.replaceState({},'',u);load()});const {data,error}=await ltDb.rpc('get_director_ladder',{p_director:director,p_reviewer:who});if(error){main.innerHTML='<p>Could not load this ladder.</p>';return}const editable=currentPerson()===who;const rows=data||[];main.innerHTML=`<div class="ladder-note"><b>Total /40 is the main score.</b> The four categories explain it. Personal rank and times seen are separate memory/taste fields, not part of the score.</div><div class="ladder-list">${rows.map((r,i)=>`<div class="ladder-row"><div class="rank-number">${r.personal_rank?('#'+r.personal_rank):'—'}</div><div class="ladder-film"><div class="film-title">${esc(r.title)} <span class="meta">(${r.year})</span></div><div class="score-line">${scoreLine(r)}</div><div class="meta memory-line">${esc(viewingLine(r))}</div></div>${editable?`<div class="ladder-edit"><label>Rank<input id="rank-${r.film_id}" type="number" min="1" max="30" value="${r.personal_rank??''}" placeholder="—"></label><label>Times seen<select id="seen-${r.film_id}"><option value="">—</option>${['1','2','3-5','6-10','10+'].map(x=>`<option value="${x}" ${r.times_seen_bucket===x?'selected':''}>${x}</option>`).join('')}</select></label><button class="pill" id="save-${r.film_id}">Save</button></div>`:'<div></div>'}</div>`).join('')}</div>`;if(editable)rows.forEach(r=>document.getElementById('save-'+r.film_id).onclick=()=>save(r))}
load();
</script><style>.ladder-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.ladder-note{padding:12px 14px;background:var(--paper2);border-left:3px solid var(--ink);margin-bottom:8px}.ladder-row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.rank-number{font-family:'DM Serif Display',serif;font-size:24px}.score-line{font-size:13px;margin-top:4px}.memory-line{margin-top:4px}.ladder-edit{display:flex;align-items:end;gap:8px;flex-wrap:wrap}.ladder-edit label{display:grid;gap:3px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.ladder-edit input,.ladder-edit select{font:inherit;padding:7px 8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:68px}.ladder-edit select{min-width:92px}@media(max-width:720px){.ladder-head{display:block}.ladder-head .btn{margin-top:10px}.ladder-row{grid-template-columns:38px 1fr}.ladder-edit{grid-column:2/-1}.score-line{line-height:1.5}}</style></body></html>
