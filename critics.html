<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Critic Cards</title><link rel="stylesheet" href="/styles.css?v=124"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=124"></script></head><body><div class="wrap"><div id="mast"></div><h1>Critic Cards</h1><p class="lede">Each Toro's record: official club scores first, then the side quests.</p><div id="tabs" class="tabs"></div><div id="main" class="card">Loading the record…</div><div class="footer">Official club films are the main record. Other watches stay useful, but separate. <span class="meta">Build v1.2.4</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const order=['Greg','Keith','David','Steele','Will'];let rows=[],extras=[];
function n(v){return v==null?null:Number(v)}
function fmt1(v){return v==null?'—':Number(v).toFixed(1)}
function totalClass(v){if(v==null)return 'total-none';v=Number(v);return v>=35?'total-great':v>=30?'total-good':v>=24?'total-mid':'total-low'}
function avg(arr,key){const v=arr.map(x=>n(x[key])).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function filmList(items,max=6){if(!items?.length)return '<span class="meta">None yet.</span>';return items.slice(0,max).map(x=>`<span class="chip">${esc(x.title)}${x.year?' ('+x.year+')':''}</span>`).join(' ')}
function directorList(items){if(!items?.length)return '<span class="meta">None yet.</span>';return items.map(x=>`<span class="chip">${esc(x.name||x.title||x)}</span>`).join(' ')}
function singleFilm(f){return f?.title?`${esc(f.title)}${f.year?' ('+f.year+')':''}`:'—'}
function commentsList(items){if(!items?.length)return '<p class="meta">No written takes yet.</p>';return items.slice(0,3).map(x=>`<blockquote class="take"><b>${esc(x.title)}${x.year?' ('+x.year+')':''}</b>${x.what_is_it?`<div>${esc(x.what_is_it)}</div>`:''}${x.takeaway?`<div class="meta">“${esc(x.takeaway)}”</div>`:''}</blockquote>`).join('')}
function favoriteFilmList(items,mine){if(!items?.length)return '<span class="meta">None yet.</span>';const scored=new Map(mine.filter(r=>r.total_40!=null).map(r=>[String(r.film_id),n(r.total_40)]));return items.map((x,i)=>({x,i,score:scored.get(String(x.film_id))??null})).sort((a,b)=>a.score==null&&b.score==null?a.i-b.i:a.score==null?1:b.score==null?-1:b.score-a.score).map(({x,score})=>`<span class="chip">${esc(x.title)}${x.year?' ('+x.year+')':''}${score!=null?` <b>${score.toFixed(1)}/40</b>`:' <span class="meta">unscored</span>'}</span>`).join(' ')}
function rankedRows(items,name,quiet=false){const sorted=[...items].sort((a,b)=>(n(b.total_40)??-999)-(n(a.total_40)??-999)||String(a.title).localeCompare(String(b.title)));let rank=0;return `<div class="rank-list ${quiet?'quiet-list':''}">${sorted.map(r=>{const complete=r.total_40!=null;const pos=complete?++rank:null;return `<div class="rank-row"><div class="rank-num">${pos?'#'+pos:'—'}</div><div class="rank-film"><b>${esc(r.title)}</b> <span class="meta">${r.year||''}</span>${r.canon?' <span class="canon-badge">CANON</span>':''}${r.rating_kind==='recalibrated'?' <span class="recal-badge">Recalibrated</span>':''}<div class="score-breakdown">${complete?`<strong>${fmt1(r.total_40)} /40</strong> · CR ${fmt1(r.craft)} · IM ${fmt1(r.emotional_impact)} · RW ${fmt1(r.rewatchability)} · OV ${fmt1(r.overall)}`:`<span class="meta">Incomplete legacy score</span>`}</div></div>${currentPerson()===name&&r.overall!=null?`<a class="mini-action" href="/recalibrate.html?film=${encodeURIComponent(r.film_id)}&who=${encodeURIComponent(name)}">Recalibrate</a>`:''}</div>`}).join('')}</div>`}
function scoreSection(name,mine,ex){const official=mine.filter(r=>r.official),other=mine.filter(r=>!r.official);const completeOfficial=official.filter(r=>r.total_40!=null);const ta=avg(completeOfficial,'total_40'),rw=avg(completeOfficial,'rewatchability'),ov=avg(completeOfficial,'overall');return `<section class="section"><div class="eyebrow">THE SCORE</div><h3>Personal club ranking</h3><div class="score-grid"><div class="score-stat score-main ${totalClass(ta)}"><span class="eyebrow">Avg Total</span><b>${fmt1(ta)}</b><span class="meta">/40</span></div><div class="score-stat"><span class="eyebrow">Avg RW</span><b>${fmt1(rw)}</b></div><div class="score-stat"><span class="eyebrow">Avg Overall</span><b>${fmt1(ov)}</b></div><div class="score-stat"><span class="eyebrow">Official Films</span><b>${completeOfficial.length}</b></div><div class="score-stat"><span class="eyebrow">Club Points</span><b>${Number(ex.points||0)}</b></div></div><div class="list-head"><div><span class="eyebrow">OFFICIAL CLUB FILMS</span><h4>The main record</h4></div><span class="meta">Ranked by Total /40</span></div>${official.length?rankedRows(official,name):'<p class="meta">No official club scores yet.</p>'}${other.length?`<div class="other-block"><div class="list-head"><div><span class="eyebrow">OTHER SCORED FILMS</span><h4>Side watches</h4></div><span class="meta">Useful, but outside the official club ranking</span></div>${rankedRows(other,name,true)}</div>`:''}<div class="points-note"><b>Total /40 is the main score.</b> CR = Craft · IM = Impact · RW = Rewatchability · OV = Overall. Canon is an official-club status, not a label for side watches.</div></section>`}
function criticSection(p,mine){if(!p||!p.favorite_films_today)return `<section class="section"><div class="eyebrow">THE CRITIC</div><h3>Starting point</h3><p class="meta">Critic Card starter not filled out yet.</p></section>`;return `<section class="section"><div class="eyebrow">THE CRITIC</div><h3>What they say they like</h3><div class="profile-row"><b>Five favorites — today</b><div>${favoriteFilmList(p.favorite_films_today,mine)}</div></div><div class="profile-row"><b>Would watch tonight</b><div>${filmList(p.watch_tonight,3)}</div></div><div class="profile-row"><b>Favorite directors</b><div>${directorList(p.favorite_directors)}</div></div><div class="profile-row"><b>Favorite genres</b><div>${(p.favorite_genres||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join(' ')||'—'}</div></div><div class="profile-grid"><div><span class="eyebrow">Underrated</span><b>${singleFilm(p.underrated)}</b></div><div><span class="eyebrow">Overrated</span><b>${singleFilm(p.overrated)}</b></div><div><span class="eyebrow">Will Defend</span><b>${singleFilm(p.defend_to_club)}</b></div><div><span class="eyebrow">Doesn't Fit</span><b>${singleFilm(p.surprise_favorite)}</b></div></div><div class="rewatch-creed"><span class="eyebrow">Rewatchability</span><div>${esc(p.rewatch_definition||'—')}</div></div></section>`}
function directorsSection(name){return `<section class="section"><div class="eyebrow">DIRECTORS</div><h3>The ladders</h3><div class="director-grid"><a class="director-card" href="/director-ladder.html?critic=${encodeURIComponent(name)}&director=kubrick"><span class="eyebrow">Director Ladder</span><b>Stanley Kubrick</b><span>13 features →</span></a><a class="director-card" href="/director-ladder.html?critic=${encodeURIComponent(name)}&director=coen-brothers"><span class="eyebrow">Director Ladder</span><b>Coen Brothers</b><span>18 features →</span></a></div></section>`}
function clubSection(ex){return `<section class="section"><div class="eyebrow">THE CLUB</div><h3>What they've done here</h3><div class="grid"><div class="card"><div class="eyebrow">Nominated</div><p>${filmList(ex.nomination_films)}</p></div><div class="card"><div class="eyebrow">Picked</div><p>${filmList(ex.pick_films)}</p></div></div><div class="takes-card"><div class="eyebrow">In Their Own Words</div>${commentsList(ex.comments)}</div></section>`}
function render(name){const mine=rows.filter(r=>r.display_name===name),ex=extras.find(x=>x.name===name)||{};tabs.innerHTML=order.map(nm=>`<button class="tab ${nm===name?'active':''}" data-name="${nm}">${nm}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.name));main.innerHTML=`<div class="critic-header"><div class="eyebrow">LOS TOROS CRITIC</div><h2>${esc(name)}</h2><div class="meta">Scores change. Taste wanders. The record remembers.</div></div>${scoreSection(name,mine,ex)}${criticSection(ex.profile_starter,mine)}${directorsSection(name)}${clubSection(ex)}`}
(async()=>{const [a,b]=await Promise.all([ltDb.rpc('get_critic_scorecards'),ltDb.rpc('get_critic_card_extras')]);if(a.error||b.error){main.innerHTML='<p>Could not load Critic Cards.</p>';return}rows=a.data||[];extras=b.data||[];const requested=new URLSearchParams(location.search).get('critic');const who=order.includes(requested)?requested:currentPerson();render(order.includes(who)?who:'Greg')})();
</script><style>.critic-header{padding:6px 0 18px;border-bottom:3px solid var(--ink);margin-bottom:20px}.critic-header h2{font-size:38px;margin:2px 0}.section{padding:22px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}.section h3{font-size:23px;margin:3px 0 14px}.section h4{font-size:18px;margin:2px 0}.score-grid{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:9px}.score-stat{border:1px solid var(--line);padding:13px;display:flex;min-height:82px;flex-direction:column;justify-content:space-between}.score-stat b{font-size:25px}.score-main{border-width:2px}.list-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:22px 0 6px}.rank-row{display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.rank-num{font-family:'DM Serif Display',serif;font-size:21px}.score-breakdown{margin-top:4px;font-size:12px;line-height:1.5}.score-breakdown strong{font-size:14px}.other-block{margin-top:28px;padding-top:18px;border-top:2px dashed var(--line)}.quiet-list{opacity:.78}.canon-badge,.recal-badge{display:inline-block;padding:2px 5px;border:1px solid var(--ink);font-size:9px;letter-spacing:.06em;margin-left:5px}.total-pill{padding:5px 7px;font-weight:800}.total-low{background:#f1d8d1}.total-mid{background:#f2e1b8}.total-good{background:#d8e5cf}.total-great{background:#bdd6c2}.total-none{background:var(--paper2)}.mini-action{font-size:10px;font-weight:800;text-transform:uppercase}.points-note{margin-top:14px;padding:11px;border-left:2px solid var(--line);font-size:12px;color:var(--muted)}.chip{display:inline-block;border:1px solid var(--line);padding:5px 8px;margin:2px;font-size:12px}.profile-row{padding:11px 0;border-top:1px solid var(--line)}.profile-row>b{display:block;margin-bottom:6px}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 0}.profile-grid>div{padding:11px;background:var(--paper2);display:flex;flex-direction:column;gap:4px}.rewatch-creed{padding:14px;border:2px solid var(--ink)}.director-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.director-card{border:2px solid var(--ink);padding:15px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:5px}.director-card b{font-size:20px}.takes-card{margin-top:12px;padding:14px;background:var(--paper2)}.take{margin:10px 0;padding-left:12px;border-left:2px solid var(--line)}@media(max-width:760px){.score-grid{grid-template-columns:1fr 1fr}.score-main{grid-column:1/-1}.director-grid{grid-template-columns:1fr}.rank-row{grid-template-columns:36px 1fr}.rank-row .mini-action{grid-column:2}.list-head{display:block}.profile-grid{grid-template-columns:1fr}}</style></body></html>
