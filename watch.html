<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Shared Watch</title><link rel="stylesheet" href="/styles.css?v=121"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=121"></script></head><body><div class="wrap"><div id="mast"></div><div id="main" class="card">Opening the shared watch…</div></div><script src="/common.js?v=115"></script><script>
document.getElementById('mast').innerHTML=mast();
const main=document.getElementById('main');
const qp=new URLSearchParams(location.search);
const pathParts=location.pathname.split('/').filter(Boolean);
const slug=qp.get('watch')||(pathParts[0]==='watch'&&pathParts[1]?decodeURIComponent(pathParts[1]):null);
(async()=>{
 if(!slug){main.textContent='Missing shared watch.';return}
 const who=currentPerson();
 // Official Los Toros screenings always use the club flow, even if somebody opens an old /watch/ link.
 const club=await ltDb.rpc('get_club_watch',{p_slug:slug,p_reviewer:who||null});
 if(!club.error&&club.data){location.replace('/club/'+encodeURIComponent(slug));return}
 // All side watches now use review.html for both first-time scoring and resumed reveal.
 // review.html reconnects an existing score by member name + watch slug, preserving blind access for unscored viewers.
 location.replace('/review.html?watch='+encodeURIComponent(slug));
})();
</script></body></html>
