<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Score a Film</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="wrap"><div id="mast"></div><h1>Score a Film</h1><p class="lede">Any film. Any time. No nomination required.</p><div class="notice">Pick the exact movie first, then score it. This is the one-off link for members or guests.</div><form id="form"><div class="field"><label>Find the film</label><input id="filmSearch" autocomplete="off" placeholder="Start typing: The Thing, Heat, Cape Fear…"><div id="lookupStatus" class="meta" style="margin-top:6px">Choose the correct film from the matches below.</div><div id="matches" class="lookup-grid"></div><div id="selectedFilm" class="notice success hide"></div></div><div class="field"><label>You</label><select id="who" required></select></div><div id="guestField" class="field hide"><label>Guest / friend name</label><input id="guestName" placeholder="Name"></div><div id="scores"></div><div class="field"><label>What is this film?</label><textarea id="what" placeholder="Your short description"></textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="The thing you'd say walking out"></textarea></div><button class="btn" type="submit">Lock My Scores</button></form><div id="msg" class="notice hide"></div><div id="reveal" class="hide"></div><div class="footer">Score only. This does not nominate a movie for Los Toros.</div></div><script src="common.js"></script><script>
document.getElementById('mast').innerHTML=mast();
const who=document.getElementById('who'),guestField=document.getElementById('guestField'),guestName=document.getElementById('guestName'),filmSearch=document.getElementById('filmSearch'),matches=document.getElementById('matches'),lookupStatus=document.getElementById('lookupStatus'),selectedFilmEl=document.getElementById('selectedFilm'),scores=document.getElementById('scores'),form=document.getElementById('form'),msg=document.getElementById('msg'),reveal=document.getElementById('reveal');
who.innerHTML='<option value="">Choose…</option>'+memberOptions(true);who.onchange=()=>guestField.classList.toggle('hide',who.value!=='__guest');
const cats=[['craft','Craft','How well does it execute the craft of cinema?'],['impact','Emotional Impact','How did it land emotionally?'],['rewatch','Rewatchability','Do you want to live with it again?'],['overall','Overall','Bottom line: how much do you love it?']];
scores.innerHTML=cats.map(([id,n,d])=>`<div class="score-row"><div><label>${n}</label><div class="meta">${d}</div><input id="${id}" type="range" min="1" max="10" step="0.1" value="7" oninput="document.getElementById('${id}N').textContent=Number(this.value).toFixed(1)"></div><div id="${id}N" class="num">7.0</div></div>`).join('');
let selected=null,timer=null,requestNo=0;
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function chooseFilm(f){selected=f;filmSearch.value=`${f.title}${f.year?' ('+f.year+')':''}`;selectedFilmEl.innerHTML=`<b>${esc(f.title)}${f.year?' ('+f.year+')':''}</b>${f.director?` · ${esc(f.director)}`:''}${f.genre?`<div class="meta">${esc(f.genre)}</div>`:''}`;selectedFilmEl.classList.remove('hide');matches.innerHTML='';lookupStatus.textContent='Film locked. Change the search to choose a different one.'}
async function lookup(){const q=filmSearch.value.trim();selected=null;selectedFilmEl.classList.add('hide');if(q.length<2){matches.innerHTML='';lookupStatus.textContent='Choose the correct film from the matches below.';return}const my=++requestNo;lookupStatus.textContent='Looking up films…';try{const url=window.LT_CONFIG.SUPABASE_URL+'/functions/v1/movie-lookup?q='+encodeURIComponent(q);const r=await fetch(url);const j=await r.json();if(my!==requestNo)return;const arr=j.candidates||[];if(!arr.length){matches.innerHTML='<div class="card meta">No match yet. Try adding a year or director to your search.</div>';lookupStatus.textContent='No film selected.';return}lookupStatus.textContent='Pick the right one:';matches.innerHTML=arr.map((f,i)=>`<button type="button" class="lookup-card" data-i="${i}"><b>${esc(f.title)}${f.year?' ('+f.year+')':''}</b><span>${esc([f.director,f.genre].filter(Boolean).join(' · '))}</span>${f.blurb?`<small>${esc(f.blurb)}</small>`:''}</button>`).join('');matches.querySelectorAll('.lookup-card').forEach(b=>b.onclick=()=>chooseFilm(arr[Number(b.dataset.i)]))}catch(e){lookupStatus.textContent='Movie lookup is temporarily unavailable. Try again in a moment.';matches.innerHTML=''}}
filmSearch.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(lookup,500)});
form.onsubmit=async e=>{e.preventDefault();const btn=e.submitter;if(!selected){showMsg(msg,'Choose the correct film from the lookup results first.','error');return}if(!ltDb){showMsg(msg,'Database connection is not ready. Refresh and try again.','error');return}let reviewer=who.value==='__guest'?guestName.value.trim():who.value;if(!reviewer){showMsg(msg,'Add your name first.','error');return}btn.disabled=true;btn.textContent='Saving…';const payload={p_title:selected.title,p_year:selected.year||null,p_reviewer:reviewer,p_craft:Number(document.getElementById('craft').value),p_impact:Number(document.getElementById('impact').value),p_rewatch:Number(document.getElementById('rewatch').value),p_overall:Number(document.getElementById('overall').value),p_what:document.getElementById('what').value.trim()||null,p_takeaway:document.getElementById('takeaway').value.trim()||null,p_watch_event:null};const {error}=await ltDb.rpc('submit_movie_rating',payload);btn.disabled=false;btn.textContent='Lock My Scores';if(error){showMsg(msg,error.message,'error');return}showMsg(msg,'Locked.','success');reveal.classList.remove('hide');reveal.innerHTML=`<h2>Your scorecard</h2><div class="card"><h3>${esc(selected.title)}${selected.year?' ('+selected.year+')':''}</h3><div class="statline">${cats.map(([id,n])=>`<div class="stat"><b>${Number(document.getElementById(id).value).toFixed(1)}</b>${n}</div>`).join('')}</div></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
</script><style>.lookup-grid{display:grid;gap:8px;margin-top:10px}.lookup-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper2);padding:12px;font:inherit;color:var(--ink);cursor:pointer}.lookup-card:hover{border-color:var(--ink)}.lookup-card b,.lookup-card span,.lookup-card small{display:block}.lookup-card span{font-size:11px;color:var(--muted);margin-top:3px}.lookup-card small{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.35}</style></body></html>
