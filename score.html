<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Score a Film</title><link rel="stylesheet" href="styles.css?v=125"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=125"></script></head><body><div class="wrap"><div id="mast"></div><h1>Score a Film</h1><p class="lede">Any film. Any time. No nomination required.</p><div class="notice">Enter the number you mean. No sliders, no accidental 7.0s. Rating does not nominate a film or affect The Dennis / Queue.</div><form id="form"><div class="field"><label>Find the film</label><input id="filmSearch" autocomplete="off" placeholder="Start typing: Moneyball, Heat, Cape Fear…"><div id="lookupStatus" class="meta" style="margin-top:6px">Type at least 3 letters, then choose the correct movie.</div><div id="matches" class="lookup-grid"></div><div id="selectedFilm" class="notice success hide"></div></div><div class="field"><label>You</label><select id="who" required></select></div><div id="guestField" class="field hide"><label>Guest / friend name</label><input id="guestName" placeholder="Name"></div><div id="scores" class="numeric-score-grid"></div><div class="field"><label>What is this film?</label><textarea id="what" placeholder="Optional — short description"></textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="Optional — the thing you'd say walking out"></textarea></div><button class="btn" type="submit">Lock My Scores</button></form><div id="msg" class="notice hide"></div><div id="reveal" class="hide"></div><div class="footer">Exact scores. Fresh opinion. <span class="meta">Build v1.2.5</span></div></div><script src="common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const who=document.getElementById('who'),guestField=document.getElementById('guestField'),guestName=document.getElementById('guestName'),filmSearch=document.getElementById('filmSearch'),matches=document.getElementById('matches'),lookupStatus=document.getElementById('lookupStatus'),selectedFilmEl=document.getElementById('selectedFilm'),scores=document.getElementById('scores'),form=document.getElementById('form'),msg=document.getElementById('msg'),reveal=document.getElementById('reveal');
who.innerHTML='<option value="">Choose…</option>'+memberOptions(true);const cp=currentPerson();if(cp&&[...who.options].some(o=>o.value===cp))who.value=cp;who.onchange=()=>guestField.classList.toggle('hide',who.value!=='__guest');
const cats=[['craft','Craft','How well does it execute the craft of cinema?'],['impact','Impact','How did it land emotionally?'],['rewatch','Rewatchability','Do you want to live with it again?'],['overall','Overall','Bottom line: how much do you love it?']];
scores.innerHTML=cats.map(([id,n,d])=>`<label class="numeric-score"><span><b>${n}</b><small>${d}</small></span><input id="${id}" type="number" min="1" max="10" step="0.1" inputmode="decimal" placeholder="—" required aria-label="${n} score from 1 to 10"></label>`).join('');
let selected=null,timer=null,seq=0;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function chooseFilm(f){selected=f;filmSearch.value=`${f.title}${f.year?' ('+f.year+')':''}`;selectedFilmEl.innerHTML=`<b>${esc(f.title)}${f.year?' ('+f.year+')':''}</b>${f.director?` · ${esc(f.director)}`:''}${f.genre?`<div class="meta">${esc(f.genre)}</div>`:''}${f.blurb?`<div class="meta" style="margin-top:6px">${esc(f.blurb)}</div>`:''}`;selectedFilmEl.classList.remove('hide');matches.innerHTML='';lookupStatus.textContent='Film selected.'}
async function searchFilms(){const q=filmSearch.value.trim();selected=null;selectedFilmEl.classList.add('hide');if(q.length<3){matches.innerHTML='';lookupStatus.textContent='Type at least 3 letters, then choose the correct movie.';return}const mine=++seq;lookupStatus.textContent='Searching movies…';try{const arr=await publicMovieSearch(q);if(mine!==seq)return;if(!arr.length){matches.innerHTML='';lookupStatus.textContent='No movie match yet — add a few more letters.';return}lookupStatus.textContent='Choose the right movie:';matches.innerHTML=arr.map((f,i)=>`<button type="button" class="lookup-card" data-i="${i}"><b>${esc(f.title)}${f.year?' ('+f.year+')':''}</b><span>${esc([f.director,f.genre].filter(Boolean).join(' · '))}</span></button>`).join('');matches.querySelectorAll('.lookup-card').forEach(b=>b.onclick=()=>chooseFilm(arr[Number(b.dataset.i)]))}catch(e){console.error('lookup failed',e);lookupStatus.textContent='Movie search hit a network error. Try once more.';matches.innerHTML=''}}
filmSearch.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(searchFilms,500)});const qp=new URLSearchParams(location.search);if(qp.get('film')){filmSearch.value=qp.get('film');setTimeout(searchFilms,50)}
function scoreValue(id){const el=document.getElementById(id),v=Number(el.value);if(!Number.isFinite(v)||v<1||v>10)return null;return Math.round(v*10)/10}
form.onsubmit=async e=>{e.preventDefault();const btn=e.submitter;if(!selected){showMsg(msg,'Choose the correct movie first.','error');return}let reviewer=who.value==='__guest'?guestName.value.trim():who.value;if(!reviewer){showMsg(msg,'Add your name first.','error');return}const vals=Object.fromEntries(cats.map(([id])=>[id,scoreValue(id)]));if(Object.values(vals).some(v=>v==null)){showMsg(msg,'Enter all four scores from 1.0 to 10.0.','error');return}btn.disabled=true;btn.textContent='Saving…';const {error}=await ltDb.rpc('submit_movie_rating',{p_title:selected.title,p_year:selected.year||null,p_reviewer:reviewer,p_craft:vals.craft,p_impact:vals.impact,p_rewatch:vals.rewatch,p_overall:vals.overall,p_what:what.value.trim()||null,p_takeaway:takeaway.value.trim()||null,p_watch_event:null});btn.disabled=false;btn.textContent='Lock My Scores';if(error){showMsg(msg,error.message,'error');return}const total=vals.craft+vals.impact+vals.rewatch+vals.overall;showMsg(msg,'Locked.','success');reveal.classList.remove('hide');reveal.innerHTML=`<h2>Your scorecard</h2><div class="card"><h3>${esc(selected.title)}${selected.year?' ('+selected.year+')':''}</h3><div class="big-total">${total.toFixed(1)} / 40</div><div class="score-summary">CR ${vals.craft.toFixed(1)} · IM ${vals.impact.toFixed(1)} · RW ${vals.rewatch.toFixed(1)} · OV ${vals.overall.toFixed(1)}</div></div>`};
</script><style>.lookup-grid{display:grid;gap:8px;margin-top:10px}.lookup-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper2);padding:12px;font:inherit;color:var(--ink);cursor:pointer}.lookup-card b,.lookup-card span{display:block}.lookup-card span{font-size:11px;color:var(--muted);margin-top:3px}.numeric-score-grid{display:grid;gap:8px;margin:16px 0}.numeric-score{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.numeric-score span{display:grid;gap:3px}.numeric-score small{color:var(--muted);font-size:11px}.numeric-score input{width:100%;box-sizing:border-box;font:700 22px/1 monospace;padding:11px;text-align:center;border:1px solid var(--line);background:var(--paper);color:var(--ink)}.big-total{font-size:32px;font-weight:900;margin:8px 0}.score-summary{font-family:monospace;font-size:14px}@media(max-width:520px){.numeric-score{grid-template-columns:1fr 82px}.numeric-score input{font-size:20px}}</style></body></html>
