<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Club Watch</title><link rel="stylesheet" href="/styles.css?v=119"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=119"></script></head><body><div class="wrap"><div id="mast"></div><div id="main" class="card">Loading screening…</div><div class="footer">Score first. Talk second. <span class="meta">Build v1.1.9</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const pathSlug=location.pathname.split('/').filter(Boolean).pop();
const slug=new URLSearchParams(location.search).get('watch')||pathSlug;
const who=currentPerson();
let watch=null,poll=null;
const cats=[['craft','Craft','How well does it execute the craft of cinema?'],['impact','Emotional Impact','How did it land emotionally?'],['rewatch','Rewatchability','How strongly do you want to live with it again?'],['overall','Overall','Bottom line: how much do you love it?']];
function scoreInputs(){return cats.map(([id,n,d])=>`<div class="score-entry"><div><label for="${id}">${n}</label><div class="meta">${d}</div></div><input id="${id}" type="number" min="1" max="10" step="0.1" inputmode="decimal" value="7.0" required></div>`).join('')}
function postamble(title){
 if(title==='Barry Lyndon')return `<section class="after"><div class="eyebrow">AFTER THE REVEAL</div><h2>Beauty, distance, ambition.</h2><p>Kubrick gives us an epic saga with the visual rigor of portraiture, music that does enormous emotional work, dry comedy, and a hero whose rise and fall can feel both intimate and strangely observed from history's distance.</p><ol><li><b>Distance or emotion?</b> What is Kubrick making us feel by refusing the usual intimacy of an epic? Does the beauty push us away, pull us in, or somehow do both?</li><li><b>Why now?</b> What feels most alive today: class mobility, inherited privilege, masculinity, status performance, ambition, self-invention — or something else?</li><li><b>Where does it sit in Kubrick?</b> What does <i>Barry Lyndon</i> do better than <i>Strangelove</i>, <i>2001</i>, <i>Clockwork Orange</i>, <i>The Shining</i> or the rest?</li></ol></section>`;
 if(title==="Miller's Crossing")return `<section class="after"><div class="eyebrow">AFTER THE REVEAL</div><h2>Loyalty, language, consequence.</h2><p>Once the plot machinery settles, the movie becomes less about who outsmarted whom and more about what loyalty means when nearly every relationship is transactional.</p><ol><li><b>Tom Reagan:</b> principled, self-protective, loyal, manipulative — or some unstable mixture?</li><li><b>Second-viewing movie?</b> Where does it reward return most: plot, dialogue, performance, visual design or moral ambiguity?</li><li><b>Among the Coens:</b> what does this film reveal about what you actually value when you rank their movies against one another?</li></ol></section>`;
 return `<section class="after"><div class="eyebrow">AFTER THE REVEAL</div><h2>Now talk.</h2><ol><li>What stayed with you most?</li><li>Where did the scores reveal the biggest difference in how you experienced the film?</li><li>What would make you want to see it again?</li></ol></section>`;
}
function statusLine(){const missing=(watch.expected_names||[]).filter(n=>!(watch.scored_names||[]).includes(n));if(watch.group_revealed_at)return 'The scores are out.';if(watch.all_in)return watch.reviewer_is_picker?'ALL SCORES ARE IN. Your move.':`All ${watch.expected_count} scores are in. Waiting for ${esc(watch.picker)} to lift the curtain.`;return `${watch.scored_count} of ${watch.expected_count} are in.${missing.length?` Waiting on ${missing.map(esc).join(', ')}.`:''}`}
async function reveal(){const r=await ltDb.rpc('get_club_reveal',{p_slug:slug});if(r.error||!r.data?.unlocked)return;const rs=r.data.ratings||[];const av=k=>rs.length?rs.reduce((s,x)=>s+Number(x[k]||0),0)/rs.length:0;const ranges=cats.map(([id,n])=>{const key=id==='impact'?'impact':id==='rewatch'?'rewatch':id;const vals=rs.map(x=>Number(x[key]));return {n,range:Math.max(...vals)-Math.min(...vals)}}).sort((a,b)=>b.range-a.range);main.innerHTML=`<div class="eyebrow">LOS TOROS REVEAL</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1><div class="reveal-grid">${rs.map(x=>`<div class="reveal-card"><div class="eyebrow">${esc(x.name)}</div><div class="reveal-total">${Number(x.total).toFixed(1)}<span>/40</span></div><div class="mini-scores"><span>C ${Number(x.craft).toFixed(1)}</span><span>I ${Number(x.impact).toFixed(1)}</span><span>RW ${Number(x.rewatch).toFixed(1)}</span><span>O ${Number(x.overall).toFixed(1)}</span></div>${x.takeaway?`<p>“${esc(x.takeaway)}”</p>`:''}</div>`).join('')}</div><div class="clubline"><b>Club:</b> ${((av('craft')+av('impact')+av('rewatch')+av('overall'))).toFixed(1)} / 40 avg · RW ${av('rewatch').toFixed(1)} · Overall ${av('overall').toFixed(1)}${ranges[0]?` · Biggest split: ${ranges[0].n}`:''}</div>${postamble(watch.title)}<div class="reveal-actions"><a class="btn" href="/index.html">BACK TO THE BOARD</a></div>`;}
async function load(){const {data,error}=await ltDb.rpc('get_club_watch',{p_slug:slug,p_reviewer:who||null});if(error||!data){main.innerHTML='<p>Club screening not found.</p>';return}watch=data;if(watch.group_revealed_at){clearInterval(poll);await reveal();return}if(!who){main.innerHTML=`<div class="eyebrow">OFFICIAL CLUB WATCH</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1><p>Choose your name in the Los Toros header first.</p>`;return}if(!watch.reviewer_expected){main.innerHTML=`<div class="eyebrow">OFFICIAL CLUB WATCH</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1><p>${esc(who)}, you aren't on tonight's expected scorer list.</p><p class="meta">Expected: ${(watch.expected_names||[]).map(esc).join(', ')}</p>`;return}if(watch.my_rating){main.innerHTML=`<div class="eyebrow">SCORE LOCKED</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1><div class="locked-score"><b>${(Number(watch.my_rating.craft)+Number(watch.my_rating.emotional_impact)+Number(watch.my_rating.rewatchability)+Number(watch.my_rating.overall)).toFixed(1)} / 40</b><span>C ${Number(watch.my_rating.craft).toFixed(1)} · I ${Number(watch.my_rating.emotional_impact).toFixed(1)} · RW ${Number(watch.my_rating.rewatchability).toFixed(1)} · O ${Number(watch.my_rating.overall).toFixed(1)}</span></div><div class="curtain">${statusLine()}</div>${watch.all_in&&watch.reviewer_is_picker?`<button class="btn reveal-btn" id="launch">REVEAL THE SCORES</button>`:''}`;if(document.getElementById('launch'))document.getElementById('launch').onclick=async()=>{const b=document.getElementById('launch');b.disabled=true;b.textContent='Lifting curtain…';const x=await ltDb.rpc('launch_club_reveal',{p_slug:slug,p_picker:who});if(x.error){b.disabled=false;b.textContent='REVEAL THE SCORES';alert(x.error.message);return}await load()};return}
main.innerHTML=`<div class="eyebrow">OFFICIAL CLUB WATCH · PICKED BY ${esc(watch.picker||'—')}</div><h1>${esc(watch.title)} <span class="meta">${watch.year||''}</span></h1>${watch.venue?`<p class="meta">${esc(watch.venue)}</p>`:''}<p class="lede">Fresh viewing. Score before the conversation starts.</p><form id="form">${scoreInputs()}<div class="field"><label>What is this film?</label><textarea id="what" placeholder="Optional. A short description in your own words."></textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="Optional. The thing you'd say walking out."></textarea></div><button class="btn" type="submit">LOCK MY SCORE</button></form><div class="curtain">${statusLine()}</div>`;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;const vals={craft:Number(craft.value),impact:Number(impact.value),rewatch:Number(rewatch.value),overall:Number(overall.value)};if(Object.values(vals).some(v=>!Number.isFinite(v)||v<1||v>10)){alert('Scores must be between 1 and 10.');return}b.disabled=true;b.textContent='Locking…';const x=await ltDb.rpc('submit_movie_rating',{p_title:watch.title,p_year:watch.year||null,p_reviewer:who,p_craft:vals.craft,p_impact:vals.impact,p_rewatch:vals.rewatch,p_overall:vals.overall,p_what:what.value.trim()||null,p_takeaway:takeaway.value.trim()||null,p_watch_event:watch.watch_event_id});if(x.error){b.disabled=false;b.textContent='LOCK MY SCORE';alert(x.error.message);return}await load()};}
load();poll=setInterval(()=>{if(watch&&!watch.group_revealed_at)load()},5000);
</script><style>.score-entry{display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.score-entry input{font:inherit;font-size:22px;font-weight:800;padding:10px;text-align:center;width:100%}.curtain{margin-top:18px;padding:16px;border:2px solid var(--ink);font-weight:800;text-align:center}.locked-score{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:16px;background:var(--paper2)}.locked-score b{font-size:28px}.reveal-btn{display:block;margin:18px auto 0;font-size:18px}.reveal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.reveal-card{border:2px solid var(--ink);padding:14px;background:var(--paper2)}.reveal-total{font-size:34px;font-weight:900}.reveal-total span{font-size:13px;margin-left:3px}.mini-scores{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;font-size:12px}.clubline{padding:12px;border-left:3px solid var(--ink);margin:12px 0 22px}.after{border-top:3px solid var(--ink);padding-top:20px}.after li{margin:12px 0;line-height:1.45}.reveal-actions{margin-top:22px;text-align:center}@media(max-width:600px){.score-entry{grid-template-columns:1fr 78px}}</style></body></html>
