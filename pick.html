<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Pick the Next Watch</title><link rel="stylesheet" href="styles.css?v=108"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=108"></script></head><body><div class="wrap"><div id="mast"></div><h1>Pick the Next Watch</h1><p class="lede">One swing. Your call.</p><div id="state" class="notice"></div><div id="film" class="card"></div><form id="form"><div class="field"><label>You</label><select id="picker" required></select></div><button class="btn" type="submit">Make This the Next Watch</button></form><div id="msg" class="notice hide"></div><div class="footer">Picking closes this film's Queue cycle and advances the rotation. <span class="meta">Build v1.0.8</span></div></div><script src="common.js?v=108"></script><script>document.getElementById('mast').innerHTML=mast();const state=document.getElementById('state'),filmEl=document.getElementById('film'),form=document.getElementById('form'),picker=document.getElementById('picker'),msg=document.getElementById('msg');picker.innerHTML='<option value="">Choose…</option>'+memberOptions(false);const remembered=localStorage.getItem('lt_person');if(remembered&&MEMBERS.includes(remembered))picker.value=remembered;const qp=new URLSearchParams(location.search),title=qp.get('title'),year=qp.get('year')?Number(qp.get('year')):null;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));filmEl.innerHTML=`<h3>${esc(title||'Film')}${year?' ('+year+')':''}</h3>`;(async()=>{const {data,error}=await ltDb.rpc('get_picker_state');if(error){state.textContent='Could not load the batting order.';return}state.innerHTML=data.next_watch?`<b>${esc(data.next_watch.title)} is already the next Watch.</b>`:`<b>At bat: ${esc(data.current_picker)}.</b> On deck: ${esc(data.on_deck)}.`})();form.onsubmit=async e=>{e.preventDefault();const btn=e.submitter;if(!title){showMsg(msg,'Missing film.','error');return}btn.disabled=true;btn.textContent='Locking it in…';const {data,error}=await ltDb.rpc('pick_queue_film',{p_title:title,p_year:year,p_picker:picker.value});btn.disabled=false;btn.textContent='Make This the Next Watch';if(error){showMsg(msg,error.message,'error');return}localStorage.setItem('lt_person',picker.value);showMsg(msg,`${title} is on deck for the next Watch. Rotation advanced.`,'success');form.classList.add('hide');setTimeout(()=>location.href='list.html',1200)};</script></body></html>
