<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — Finish Your Take</title><link rel="stylesheet" href="/styles.css?v=114"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js?v=114"></script></head><body><div class="wrap"><div id="mast"></div><h1>Finish Your Take</h1><p class="lede">The numbers are locked. Give us the part only you can write.</p><div id="main" class="card">Loading…</div><div id="msg" class="notice hide"></div><div id="reveal" class="hide"></div><div class="footer">Shared watch. Not an official Los Toros club screening. <span class="meta">Build v1.1.4</span></div></div><script src="/common.js?v=113"></script><script>
document.getElementById('mast').innerHTML=mast();
const main=document.getElementById('main'),msg=document.getElementById('msg'),reveal=document.getElementById('reveal');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const qp=new URLSearchParams(location.search),slug=qp.get('watch'),name=qp.get('who')||currentPerson();let room=null,rating=null;
function total(r){return Number(r.craft||0)+Number(r.impact||0)+Number(r.rewatch||0)+Number(r.overall||0)}
function totalClass(v){v=Number(v);return v>=35?'total-great':v>=30?'total-good':v>=24?'total-mid':'total-low'}
function criticLink(n){return MEMBERS.includes(n)?`<a href="/critics.html?critic=${encodeURIComponent(n)}">See ${esc(n)}'s Critic Card →</a>`:''}
function card(r){const t=total(r);return `<div class="card"><div class="total-hero ${totalClass(t)}"><span>Total</span><b>${fmt(t)} / 40</b></div><h3>${esc(r.name||'—')}</h3><div class="statline"><div class="stat"><b>${fmt(r.craft)}</b>Craft</div><div class="stat"><b>${fmt(r.impact)}</b>Impact</div><div class="stat"><b>${fmt(r.rewatch)}</b>Rewatch</div><div class="stat"><b>${fmt(r.overall)}</b>Overall</div></div>${r.what_is_it?`<p><b>What is it?</b> ${esc(r.what_is_it)}</p>`:''}${r.takeaway?`<p><b>Takeaway:</b> ${esc(r.takeaway)}</p>`:''}<p class="meta">${criticLink(r.name)}</p></div>`}
function analysis(rows){if(rows.length!==2)return'';const a=rows[0],b=rows[1],dims=[['Craft','craft'],['Emotional Impact','impact'],['Rewatchability','rewatch'],['Overall','overall']];const diffs=dims.map(([label,key])=>({label,key,d:Math.abs(Number(a[key]||0)-Number(b[key]||0))})).sort((x,y)=>y.d-x.d);const sameCraft=Math.abs(Number(a.craft)-Number(b.craft))<0.6;const hi=total(a)>=total(b)?a:b,lo=hi===a?b:a;let line=`${esc(hi.name)} came in ${fmt(total(hi)-total(lo))} points higher overall.`;if(sameCraft&&diffs[0].d>=2)line+=` You basically agree on the craft; the split is the experience of the movie itself — especially ${diffs[0].label.toLowerCase()}.`;else if(diffs[0].d>=1.5)line+=` The biggest disagreement is ${diffs[0].label.toLowerCase()}.`;else line+=` The interesting part is how close the component scores are despite the different totals.`;return `<div class="card analysis"><div class="kicker">The split</div><p>${line}</p></div>`}
async function showReveal(){const rr=await ltDb.rpc('get_shared_reveal',{p_watch_event:room.watch_event_id,p_rating_id:rating.rating_id});if(rr.error)return;const rows=rr.data?.ratings||[];if(!rows.length)return;reveal.classList.remove('hide');reveal.innerHTML=`<h2>The Reveal</h2><p class="lede">Two opinions, locked before either could see the other.</p><div class="compare-grid">${rows.map(card).join('')}</div>${analysis(rows)}`}
(async()=>{if(!slug||!name){main.innerHTML='<p>Missing the film or critic name.</p>';return}if(MEMBERS.includes(name))setCurrentPerson(name);const sw=await ltDb.rpc('get_shared_watch',{p_slug:slug});if(sw.error||!sw.data){main.innerHTML='<p>This shared watch is not available.</p>';return}room=sw.data;const mr=await ltDb.rpc('get_shared_rating_for_reviewer',{p_watch_event:room.watch_event_id,p_reviewer:name});if(mr.error||!mr.data){main.innerHTML=`<p>No locked score found for ${esc(name)} on ${esc(room.title)}.</p>`;return}rating=mr.data;main.innerHTML=`<div class="kicker">${esc(name)}</div><h2>${esc(room.title)}${room.year?' ('+room.year+')':''}</h2><p>Your score is already in:</p>${card(rating)}<form id="notesForm"><div class="field"><label>What is this film?</label><textarea id="what" placeholder="Your short description">${esc(rating.what_is_it||'')}</textarea></div><div class="field"><label>One sentence takeaway</label><textarea id="takeaway" placeholder="The thing you'd say walking out">${esc(rating.takeaway||'')}</textarea></div><button class="btn" type="submit">Save My Take</button></form>`;document.getElementById('notesForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Saving…';const r=await ltDb.rpc('update_shared_rating_notes',{p_rating:rating.rating_id,p_reviewer:name,p_what:document.getElementById('what').value,p_takeaway:document.getElementById('takeaway').value});b.disabled=false;b.textContent='Save My Take';if(r.error||!r.data){showMsg(msg,'Could not save your take.','error');return}rating.what_is_it=document.getElementById('what').value.trim();rating.takeaway=document.getElementById('takeaway').value.trim();showMsg(msg,'Saved. Now you can see the other score.','success');showReveal()};if(rating.what_is_it||rating.takeaway)showReveal()})();
</script><style>.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.statline{display:flex;gap:16px;flex-wrap:wrap}.stat b{display:block;font-size:24px}.total-hero{display:flex;align-items:end;justify-content:space-between;padding:10px 12px;margin:-2px -2px 14px;border-radius:7px}.total-hero span{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.total-hero b{font-size:30px}.total-low{background:#f1d8d1}.total-mid{background:#f2e1b8}.total-good{background:#d8e5cf}.total-great{background:#bdd6c2}.analysis{margin-top:14px}</style></body></html>
