<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Toros — The Board</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script></head><body><div class="wrap"><div id="mast"></div><h1>The Board</h1><p class="lede">Not the best movies. The ones worth coming back to — and why.</p><div id="status" class="notice hide"></div><div class="tabs"><button class="tab active" data-tab="dennis">The Dennis</button><button class="tab" data-tab="queue">Queue</button><button class="tab" data-tab="watched">Watched</button><button class="tab" data-tab="canon">Canon</button><button class="tab" data-tab="best">Highest Rated</button></div><div id="panel"></div><div class="footer"><div class="tagline">Los Toros is not about deciding which movies are best. It’s about discovering which movies are worth coming back to—and why.</div></div></div><script src="/common.js"></script><script>
document.getElementById('mast').innerHTML=mast();
const panel=document.getElementById('panel'), statusEl=document.getElementById('status');let data={queue:[],dennis:[],screenings:[],best:[]},tab='dennis';
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function filmInfo(x){return [x.year,x.director,x.genre].filter(Boolean).join(' · ')}
function nominateUrl(x){const p=new URLSearchParams({title:x.title});if(x.year)p.set('year',x.year);return 'nominate.html?'+p.toString()}
function nomRow(x){const info=filmInfo(x);const tip=x.blurb||info||'Click to consider nominating this film.';return `<a class="film-row film-link" href="${nominateUrl(x)}" title="${esc(tip)}"><div class="film-title">${esc(x.title)}${x.year?` <span class="meta">(${x.year})</span>`:''}<div class="meta">${esc(info)}</div><div class="meta"><b>Nominated by ${esc(x.nominators||'—')}</b></div>${x.blurb?`<div class="meta blurb">${esc(x.blurb)}</div>`:''}</div><div><span class="pill">${x.member_supports>=2?'Queue':'Back it'}</span></div><div></div></a>`}
function rowMovie(x){return `<div class="film-row"><div class="film-title">${esc(x.title)}${x.year?` <span class="meta">(${x.year})</span>`:''}</div><div>${fmt(x.avg_overall)}</div><div>${fmt(x.avg_rewatchability)}</div><div>${fmt(x.avg_craft)}</div><div>${fmt(x.avg_impact)}</div><div>${fmt(x.avg_four_category_score)}</div></div>`}
function render(){if(tab==='queue'||tab==='dennis'){const arr=data[tab];panel.innerHTML=`<div class="notice">${tab==='queue'?'2+ core members have nominated these. Next picker chooses from here.':'One Toro has made the case. Click a film to see which version and consider backing it. A second nomination moves it to the Queue.'}</div>`+(arr.length?arr.map(nomRow).join(''):'<div class="card">Nothing here yet.</div>');return}if(tab==='watched'||tab==='canon'){const arr=data.screenings.filter(x=>tab==='watched'?x.official:x.canon);panel.innerHTML=`<div class="film-row head"><div>Film</div><div>Overall</div><div>RW</div><div>Craft</div><div>Impact</div><div>Score</div></div>`+(arr.length?arr.map(rowMovie).join(''):'<div class="card">Nothing here yet.</div>');return}const ranked=[...data.best].sort((a,b)=>Number(b.avg_four_category_score||0)-Number(a.avg_four_category_score||0));panel.innerHTML=`<div class="notice">All member ratings, ranked highest to lowest by the four-score average. Canon is separate.</div><div class="film-row head"><div>Film</div><div>Overall</div><div>RW</div><div>Craft</div><div>Impact</div><div>Score</div></div>`+(ranked.length?ranked.map(rowMovie).join(''):'<div class="card">No ratings yet.</div>')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
(async()=>{try{if(!ltDb)throw new Error('Database client did not initialize');const [d,q,s,b]=await Promise.all([ltDb.from('current_nomination_status').select('*').eq('nomination_status','Dennis').order('first_nominated_at',{ascending:false}),ltDb.from('current_nomination_status').select('*').eq('nomination_status','Queue').order('member_supports',{ascending:false}),ltDb.from('club_screening_summary').select('*').order('starts_at',{ascending:false}),ltDb.from('film_member_rating_summary').select('*').order('avg_four_category_score',{ascending:false})]);for(const r of[d,q,s,b])if(r.error)throw r.error;data={dennis:d.data||[],queue:q.data||[],screenings:s.data||[],best:b.data||[]};render()}catch(e){showMsg(statusEl,'The board could not load yet: '+e.message,'error')}})();
</script><style>.film-link{color:inherit;text-decoration:none;cursor:pointer}.film-link:hover{background:rgba(255,250,240,.75)}.blurb{margin-top:5px;max-width:720px}</style></body></html>
